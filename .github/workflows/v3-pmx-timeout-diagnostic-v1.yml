name: V3 retained PMX timeout diagnostic v1
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
          cache: pip
      - name: Install pinned experiment environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Verify frozen research sources remain unchanged
        run: python scripts/verify_staged_research_lock.py configs/v3_comparison_execution_v2.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Obtain pinned author PMX jar
        env:
          AUTHOR_BASE: https://se-gitlab-extern.fzi.de/SebastianWeberFZI/ableitung-von-leistungsmodellen-in-ci/-/raw/9b8d4c5707751eeabe31f7e7d6b7de0acf0c45a2
        run: |
          mkdir -p workflow-input
          curl --fail --location --retry 8 --retry-all-errors "$AUTHOR_BASE/main.jar" --output workflow-input/main.jar
      - name: Inspect original timeout and replay exact calibration projection once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/diagnose_v3_pmx_timeout_v1.py
      - name: Retain compact diagnosis
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: v3-pmx-timeout-compact-${{ github.run_id }}
          path: workflow-results/pmx-timeout-diagnostic/compact.json
          if-no-files-found: error
          retention-days: 90
      - name: Keep original and replay payloads remotely
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: v3-pmx-timeout-full-${{ github.run_id }}
          path: workflow-results/pmx-timeout-diagnostic
          if-no-files-found: warn
          retention-days: 90
