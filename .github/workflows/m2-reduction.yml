name: M2 Structure-Preserving Reduction

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Diagnostic uses 10 campaigns; full uses the frozen 200 campaigns.
        required: true
        default: diagnostic
        type: choice
        options:
          - diagnostic
          - full

permissions:
  contents: read

concurrency:
  group: m2-reduction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    name: ${{ matrix.family }} (${{ inputs.tier }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        family:
          - same_domain_replicas
          - mandatory_fanout
          - communication_bottleneck
          - two_domain_path

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Run diagnostic reduction shard
        if: ${{ inputs.tier == 'diagnostic' }}
        run: >-
          python -m telemetry_availability run-reduction-experiment
          --config configs/rq1_synthetic.yaml
          --out "workflow-results/${{ matrix.family }}"
          --family "${{ matrix.family }}"
          --repetitions 10
          --sample-sizes 100,500

      - name: Run full reduction shard
        if: ${{ inputs.tier == 'full' }}
        run: >-
          python -m telemetry_availability run-reduction-experiment
          --config configs/rq1_synthetic.yaml
          --out "workflow-results/${{ matrix.family }}"
          --family "${{ matrix.family }}"

      - name: Upload immutable family shard
        uses: actions/upload-artifact@v7
        with:
          name: m2-${{ matrix.family }}-${{ github.run_id }}
          path: workflow-results/${{ matrix.family }}
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate M2 tables
    needs: experiment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Download family shards
        uses: actions/download-artifact@v8
        with:
          pattern: m2-*-${{ github.run_id }}
          path: workflow-shards

      - name: Aggregate reduction tables
        run: >-
          python -m telemetry_availability aggregate-reduction-experiment
          --input-root workflow-shards
          --out workflow-results/aggregate

      - name: Require likelihood preservation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("workflow-results/aggregate/manifest.json").read_text())
          failures = manifest["objective_equivalence_failures"]
          if failures:
              raise SystemExit(f"structure-preserving objective mismatches: {failures}")
          PY

      - name: Upload aggregate
        uses: actions/upload-artifact@v7
        with:
          name: m2-aggregate-${{ github.run_id }}
          path: workflow-results/aggregate
          if-no-files-found: error
          retention-days: 30
