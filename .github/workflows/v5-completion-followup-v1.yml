name: V5 matched E control stages and retrospective R accuracy
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  costs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [deathstarbench_social_network, opentelemetry_demo, spring_petclinic_microservices]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Check original locks and bounded instrumentation controls
        run: |
          python scripts/verify_staged_research_lock.py configs/v3_comparison_execution_v3.json
          python -m unittest discover -s tests -p test_completion_target_followup_v1.py -v
      - name: Measure all four routes then independently qualify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/run_completion_followup_v1.py --profile '${{ matrix.profile }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v5-followup-compact-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/completion-followup/compact/*.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v5-followup-full-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/completion-followup/full
          if-no-files-found: error
          retention-days: 90
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Compare calibration forecasts using the original test split and metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/evaluate_completion_forecasts_v1.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v5-followup-accuracy-${{ github.run_id }}
          path: workflow-results/completion-accuracy/results.json
          if-no-files-found: error
          retention-days: 90
  tables:
    needs: [costs, accuracy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: v5-followup-compact-*-${{ github.run_id }}
          path: workflow-input/followup
      - uses: actions/download-artifact@v8
        with:
          name: v5-followup-accuracy-${{ github.run_id }}
          path: workflow-input/followup/accuracy
      - run: python scripts/summarize_completion_followup_v1.py --source workflow-input/followup --out workflow-results/followup-tables
      - uses: actions/upload-artifact@v7
        with:
          name: v5-followup-tables-${{ github.run_id }}
          path: workflow-results/followup-tables
          if-no-files-found: error
          retention-days: 90
