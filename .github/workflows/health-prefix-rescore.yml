name: Historical decoder dependency qualification and full rescore
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Qualify unchanged-input scope and rescore all historical cells
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p workflow-results/compact
          /usr/bin/time -v -o workflow-results/compact/resource-usage.txt python -m telemetry_availability.health_prefix_rescore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: health-prefix-rescore-compact-${{ github.run_id }}
          path: workflow-results/compact
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: health-prefix-rescore-tables-${{ github.run_id }}
          path: workflow-results/rescore
          retention-days: 90
          if-no-files-found: error
