name: Existing applications technical graph observation build and replay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [deathstarbench_social_network, opentelemetry_demo]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: prepare ordinary graph role
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p workflow-results/source
          /usr/bin/time -v -o workflow-results/source/resource-usage.txt python -m telemetry_availability.existing_application_graph_observation prepare --profile '${{ matrix.profile }}'
      - uses: actions/upload-artifact@v7
        with:
          name: existing-graph-ordinary-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/ordinary
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: existing-graph-source-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/source
          retention-days: 90
          if-no-files-found: error
  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [deathstarbench_social_network, opentelemetry_demo]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v8
        with:
          name: existing-graph-ordinary-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-input/ordinary
      - name: build ordinary graph role
        run: |
          mkdir -p workflow-results/fit
          /usr/bin/time -v -o workflow-results/fit/resource-usage.txt python -m telemetry_availability.existing_application_graph_observation build --profile '${{ matrix.profile }}'
      - uses: actions/upload-artifact@v7
        with:
          name: existing-graph-model-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/models
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: existing-graph-fit-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/fit
          retention-days: 90
          if-no-files-found: error
  replay:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [deathstarbench_social_network, opentelemetry_demo]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v8
        with:
          name: existing-graph-model-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-input/model
      - name: replay ordinary graph role
        run: |
          mkdir -p workflow-results/replay
          /usr/bin/time -v -o workflow-results/replay/resource-usage.txt python -m telemetry_availability.existing_application_graph_observation replay --profile '${{ matrix.profile }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: existing-graph-replay-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/replay
          retention-days: 90
          if-no-files-found: error
  qualify:
    needs: [build, replay]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - uses: actions/download-artifact@v8
        with:
          pattern: existing-graph-fit-*
          path: workflow-input/reports
      - uses: actions/download-artifact@v8
        with:
          pattern: existing-graph-replay-*
          path: workflow-input/reports
      - run: python scripts/collect_existing_application_graph_observation.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: existing-graph-qualification-${{ github.run_id }}
          path: workflow-results/qualification
          retention-days: 90
          if-no-files-found: error
