name: M9H exact PMX source entrypoint

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: m9h-pmx-source-entrypoint-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIG: configs/m9h_pmx_source_entrypoint.json
  M9F_CONFIG: configs/m9f_pmx_performability_audit.json
  PYTHON_VERSION: 3.13.15
  JAVA_VERSION: "11"
  GITLAB_BASE: https://se-gitlab-extern.fzi.de
  DEMO_PROJECT_PATH: SebastianWeberFZI/ableitung-von-leistungsmodellen-in-ci
  DEMO_COMMIT: 9b8d4c5707751eeabe31f7e7d6b7de0acf0c45a2
  PMX_JAR_SHA256: befe481ab6f9db9d7b283a2ca810b9ec11a368e4ddc8cb6c669b73590d431013
  SOURCE_COMMAND: main:main -of Options.txt
  STARTUP_STABILIZATION_SECONDS: "20"
  PMX_INTERNAL_TIMEOUT_SECONDS: "180"
  M9G_RUN_ID: "34049195927"

jobs:
  source_contract:
    name: Verify M9G evidence and exact source-to-command derivation
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up exact Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install exact analysis environment and validate M9H
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m telemetry_availability.pmx_source_entrypoint validate --config "$CONFIG"

      - name: Capture accepted M9G artifact metadata and contents
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="workflow-input/m9h/metadata"
          mkdir -p "$metadata" workflow-input/m9h/m9g-recovery workflow-input/m9h/m9g-application workflow-input/m9h/m9g-decision
          for role in recovery application decision; do
            artifact_id="$(jq -r ".evidence.m9g.artifacts.${role}.id" "$CONFIG")"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$metadata/${role}.json"
          done
          gh run download "$M9G_RUN_ID" --repo "$GITHUB_REPOSITORY" --name m9g-pmx-recovery-34049195927 --dir workflow-input/m9h/m9g-recovery
          gh run download "$M9G_RUN_ID" --repo "$GITHUB_REPOSITORY" --name m9g-application-delta-34049195927 --dir workflow-input/m9h/m9g-application
          gh run download "$M9G_RUN_ID" --repo "$GITHUB_REPOSITORY" --name m9g-joint-decision-34049195927 --dir workflow-input/m9h/m9g-decision

      - name: Audit the exact embedded source command contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workflow-results/m9h-contract
          /usr/bin/time -v -o workflow-results/m9h-contract/resource-usage.txt python -m telemetry_availability.pmx_source_entrypoint audit-source-contract --config "$CONFIG" --recovery-metadata workflow-input/m9h/metadata/recovery.json --application-metadata workflow-input/m9h/metadata/application.json --decision-metadata workflow-input/m9h/metadata/decision.json --recovery-root workflow-input/m9h/m9g-recovery --application-root workflow-input/m9h/m9g-application --decision-root workflow-input/m9h/m9g-decision --out workflow-results/m9h-contract

      - name: Upload source contract
        uses: actions/upload-artifact@v7
        with:
          name: m9h-source-contract-${{ github.run_id }}
          path: workflow-results/m9h-contract
          if-no-files-found: error
          retention-days: 90

  source_entrypoint_probe:
    name: Run exact source-declared entrypoint and mechanism control
    needs: [source_contract]
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up exact Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up declared Java runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install exact analysis environment and validate M9H
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m telemetry_availability.pmx_source_entrypoint validate --config "$CONFIG"

      - name: Download source contract
        uses: actions/download-artifact@v8
        with:
          name: m9h-source-contract-${{ github.run_id }}
          path: workflow-input/m9h/source-contract

      - name: Download and byte-verify the unchanged PMX demonstration
        shell: bash
        run: |
          set -euo pipefail
          demo="workflow-input/m9h/demo"
          mkdir -p "$demo/traces"
          raw_base="$GITLAB_BASE/$DEMO_PROJECT_PATH/-/raw/$DEMO_COMMIT"
          curl --fail --location --retry 8 --retry-all-errors "$raw_base/Options.txt" --output "$demo/Options.txt"
          curl --fail --location --retry 8 --retry-all-errors "$raw_base/traces/jaegercustomers.json" --output "$demo/traces/jaegercustomers.json"
          curl --fail --location --retry 8 --retry-all-errors "$raw_base/main.jar" --output "$demo/main.jar"
          echo "$PMX_JAR_SHA256  $demo/main.jar" | sha256sum --check

      - name: Generate the unchanged one-error-in-ten mechanism control
        shell: bash
        run: >-
          python -m telemetry_availability.pmx_performability make-error-control
          --config "$M9F_CONFIG"
          --demonstration-root workflow-input/m9h/demo
          --output-trace workflow-input/m9h/control/traces/jaegercustomers-error-control.json
          --output-options workflow-input/m9h/control/Options.txt
          --manifest workflow-input/m9h/control/control-manifest.json

      - name: Screen the exact command and conditionally confirm it
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$GITHUB_WORKSPACE/workflow-input/m9h/demo/main.jar"
          execution_root="$GITHUB_WORKSPACE/workflow-results/m9h-probe/raw"

          run_probe() {
            condition="$1"
            repeat="$2"
            input_root="$3"
            run_root="$4"
            mkdir -p "$run_root/results" "$run_root/traces"
            cp "$input_root/Options.txt" "$run_root/Options.txt"
            cp "$input_root"/traces/* "$run_root/traces/"
            printf '%s\nexit 0\n' "$SOURCE_COMMAND" > "$run_root/stdin.txt"
            started_at="$(date --utc --iso-8601=seconds)"
            started_epoch="$(date +%s)"
            printf '%s\n' "$started_at" > "$run_root/started-at-utc.txt"
            printf 'event=start condition=%s repeat=%s at=%s\n' "$condition" "$repeat" "$started_at" > "$run_root/watchdog.log"
            set +e
            (
              cd "$run_root"
              /usr/bin/time -v -o resource-usage.txt timeout --signal=TERM --kill-after=10s "$PMX_INTERNAL_TIMEOUT_SECONDS"s bash -c '(sleep "$1"; date --utc --iso-8601=seconds > command-sent-at-utc.txt; cat stdin.txt) | java -DLog4jContextSelector=org.apache.logging.log4j.core.selector.BasicContextSelector -jar "$2"' bash "$STARTUP_STABILIZATION_SECONDS" "$jar_path" > stdout.log 2>&1
            )
            exit_code="$?"
            set -e
            finished_at="$(date --utc --iso-8601=seconds)"
            elapsed="$(($(date +%s) - started_epoch))"
            printf '%s\n' "$exit_code" > "$run_root/exit-code.txt"
            printf '%s\n' "$elapsed" > "$run_root/elapsed-seconds.txt"
            printf '%s\n' "$finished_at" > "$run_root/finished-at-utc.txt"
            printf 'event=finish condition=%s repeat=%s at=%s elapsed_seconds=%s exit_code=%s\n' "$condition" "$repeat" "$finished_at" "$elapsed" "$exit_code" >> "$run_root/watchdog.log"
          }

          run_probe published_original 1 "$GITHUB_WORKSPACE/workflow-input/m9h/demo" "$execution_root/screen/published_original"
          python -m telemetry_availability.pmx_source_entrypoint classify-screen --config "$CONFIG" --run-root "$execution_root/screen/published_original" --out "$execution_root/entrypoint-screen.json"

          if [[ "$(jq -r '.output_eligible' "$execution_root/entrypoint-screen.json")" == "true" ]]; then
            for condition in published_original single_error_control; do
              if [[ "$condition" == "published_original" ]]; then
                input_root="$GITHUB_WORKSPACE/workflow-input/m9h/demo"
              else
                input_root="$GITHUB_WORKSPACE/workflow-input/m9h/control"
              fi
              for repeat in 1 2; do
                run_probe "$condition" "$repeat" "$input_root" "$execution_root/confirmation/$condition/repeat-$repeat"
              done
            done
          fi

          python -m telemetry_availability.pmx_source_entrypoint record-probe --config "$CONFIG" --source-contract workflow-input/m9h/source-contract/source-contract-manifest.json --screen "$execution_root/entrypoint-screen.json" --execution-root "$execution_root" --out workflow-results/m9h-probe
          java -version > workflow-results/m9h-probe/java-version.txt 2>&1

      - name: Upload exact entrypoint evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: m9h-entrypoint-probe-${{ github.run_id }}
          path: workflow-results/m9h-probe
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90

  source_entrypoint_decision:
    name: Apply frozen source-entrypoint decision
    needs: [source_contract, source_entrypoint_probe]
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up exact Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install exact analysis environment and validate M9H
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m telemetry_availability.pmx_source_entrypoint validate --config "$CONFIG"

      - name: Download source contract
        uses: actions/download-artifact@v8
        with:
          name: m9h-source-contract-${{ github.run_id }}
          path: workflow-input/m9h/source-contract

      - name: Download exact entrypoint evidence
        uses: actions/download-artifact@v8
        with:
          name: m9h-entrypoint-probe-${{ github.run_id }}
          path: workflow-input/m9h/probe

      - name: Apply the frozen diagnostic decision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workflow-results/m9h-decision
          /usr/bin/time -v -o workflow-results/m9h-decision/resource-usage.txt python -m telemetry_availability.pmx_source_entrypoint decide --config "$CONFIG" --source-contract workflow-input/m9h/source-contract/source-contract-manifest.json --probe workflow-input/m9h/probe/entrypoint-probe-manifest.json --out workflow-results/m9h-decision

      - name: Upload M9H decision
        uses: actions/upload-artifact@v7
        with:
          name: m9h-entrypoint-decision-${{ github.run_id }}
          path: workflow-results/m9h-decision
          if-no-files-found: error
          retention-days: 90
