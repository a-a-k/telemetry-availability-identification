name: M9P No-Fit Temporal Preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: m9p-temporal-preflight
  cancel-in-progress: false

jobs:
  campaign:
    name: preflight / ${{ matrix.placement }} / ${{ matrix.law }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        application:
          - profile: opentelemetry_demo
            repository: open-telemetry/opentelemetry-demo
            commit: 8c47d47c9ac27710d2b2a153bcd53e483bffe66d
            compose_file: compose.yaml
        placement: [colocated, split]
        law: [N, ND]
        repetition: [0]
    steps:
      - name: Check out frozen experiment repository
        uses: actions/checkout@v7

      - name: Check out exact benchmark revision
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.application.repository }}
          ref: ${{ matrix.application.commit }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Record runner resources
        run: |
          out="workflow-results/m9p-raw/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}"
          mkdir -p "$out"
          uname -a > "$out/runner.txt"
          docker version >> "$out/runner.txt"
          docker compose version >> "$out/runner.txt"
          free -h >> "$out/runner.txt"
          df -h >> "$out/runner.txt"

      - name: Render, digest-lock, and replicate benchmark
        env:
          DEMO_VERSION: "3.0.0"
          LOCUST_AUTOSTART: "false"
          LOCUST_HEADLESS: "true"
          LOCUST_BROWSER_TRAFFIC_ENABLED: "false"
        run: |
          out="workflow-results/m9p-raw/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}"
          if [[ "${{ matrix.application.profile }}" == "opentelemetry_demo" ]]; then
            export OTEL_COLLECTOR_CONFIG_EXTRAS="$GITHUB_WORKSPACE/configs/live/otel-pilot-collector-extra.yml"
            docker compose --env-file upstream/.env -f "upstream/${{ matrix.application.compose_file }}" config --format json > "$out/rendered-compose.json"
            telemetry_args=(--telemetry-output-directory "$GITHUB_WORKSPACE/$out")
          else
            docker compose -f "upstream/${{ matrix.application.compose_file }}" config --format json > "$out/rendered-compose.json"
            telemetry_args=()
          fi
          python -m telemetry_availability pin-live-compose \
            --config configs/m7_runtime_pilot.yaml \
            --profile "${{ matrix.application.profile }}" \
            --input "$out/rendered-compose.json" \
            --out "$out/base-pinned-compose.json" \
            --audit "$out/base-image-lock-audit.json" \
            "${telemetry_args[@]}"
          python -m telemetry_availability prepare-placement-compose \
            --config configs/m7b_placement_pilot.yaml \
            --profile "${{ matrix.application.profile }}" \
            --placement "${{ matrix.placement }}" \
            --input "$out/base-pinned-compose.json" \
            --base-audit "$out/base-image-lock-audit.json" \
            --out "$out/pinned-compose.json" \
            --audit "$out/image-lock-audit.json" \
            --haproxy "$out/haproxy.cfg"

      - name: Pull and start replicated benchmark
        run: |
          compose="workflow-results/m9p-raw/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}/pinned-compose.json"
          docker compose -f "$compose" pull
          docker compose -f "$compose" up -d --no-build --wait --wait-timeout 360

      - name: Collect separate preflight with fresh provenance
        run: >-
          python -m telemetry_availability.temporal_confirmation_live run-cell
          --scope preflight --placement "${{ matrix.placement }}" --law "${{ matrix.law }}"
          --repetition "${{ matrix.repetition }}" --checkout upstream
          --compose "workflow-results/m9p-raw/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}/pinned-compose.json" --image-audit "workflow-results/m9p-raw/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}/image-lock-audit.json" --out "workflow-results/m9p-raw/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}"

      - name: Qualify and publish separate learner and evaluator bundles without fitting
        run: >-
          python -m telemetry_availability.temporal_confirmation_live qualify
          --scope preflight --source "workflow-results/m9p-raw/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}" --out workflow-results/separated

      - name: Compact runtime diagnostics
        if: ${{ always() }}
        run: |
          docker compose -f "workflow-results/m9p-raw/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}/pinned-compose.json" ps --format json > "workflow-results/m9p-raw/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}/compose-ps.json" || true
          docker stats --no-stream --format '{{json .}}' > "workflow-results/m9p-raw/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}/docker-stats.jsonl" || true

      - name: Failure logs
        if: ${{ failure() }}
        run: docker compose -f "workflow-results/m9p-raw/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}/pinned-compose.json" logs --no-color > "workflow-results/m9p-raw/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}/compose.log" 2>&1 || true

      - name: Preserve original source attempt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: m9p-preflight-raw-${{ matrix.placement }}-${{ matrix.law }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: workflow-results/m9p-raw/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}
          if-no-files-found: error
          retention-days: 7

      - name: Preserve learner preflight bundle
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: m9p-preflight-learner-${{ matrix.placement }}-${{ matrix.law }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: workflow-results/separated/learner-bundle
          if-no-files-found: error
          retention-days: 90

      - name: Preserve evaluator preflight bundle
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: m9p-preflight-evaluator-${{ matrix.placement }}-${{ matrix.law }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: workflow-results/separated/evaluator-bundle
          if-no-files-found: error
          retention-days: 90

      - name: Preserve audit preflight bundle
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: m9p-preflight-audit-${{ matrix.placement }}-${{ matrix.law }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: workflow-results/separated/audit-bundle
          if-no-files-found: error
          retention-days: 90

      - name: Tear down benchmark
        if: ${{ always() }}
        run: docker compose -f "workflow-results/m9p-raw/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}/pinned-compose.json" down --volumes --remove-orphans || true

  audit:
    name: Audit four-cell no-fit preflight
    needs: campaign
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v8
        with:
          pattern: m9p-preflight-audit-*-${{ github.run_id }}-a${{ github.run_attempt }}
          path: workflow-results/preflight-input
      - name: Audit without fitting or effect estimation
        run: >-
          python -m telemetry_availability.temporal_confirmation_live audit-preflight
          --input-root workflow-results/preflight-input --out workflow-results/preflight-audit
      - uses: actions/upload-artifact@v7
        with:
          name: m9p-no-fit-preflight-${{ github.run_id }}-a${{ github.run_attempt }}
          path: workflow-results/preflight-audit
          if-no-files-found: error
          retention-days: 90
