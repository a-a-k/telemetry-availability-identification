name: V4 confirmation aggregate repair v3
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install the same statistical environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Preserve all original scientific locks
        run: python scripts/verify_staged_research_lock.py configs/v3_comparison_execution_v3.json
      - name: Reaggregate exact saved results with the prespecified split-only scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/repair_v4_confirmation_summary_v3.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v4-confirmation-summary-v3-${{ github.run_id }}
          path: workflow-results/summary
          if-no-files-found: error
          retention-days: 90
