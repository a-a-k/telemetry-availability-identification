name: V3 primary attempt compatibility audit v1
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile: [deathstarbench_social_network, opentelemetry_demo, spring_petclinic_microservices]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - name: Install fixed dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Verify frozen scientific sources and two-sided audit controls
        run: |
          python scripts/verify_staged_research_lock.py configs/v3_comparison_execution_v3.json
          python -m unittest discover -s tests -p test_attempt_compatibility_audit_v1.py -v
      - name: Diagnose largest discrepancies and matched controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/audit_v3_attempts_v1.py run --profile ${{ matrix.profile }} --wave first --out workflow-results/audit
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: v3-attempt-audit-v1-first-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/audit/compact
          retention-days: 90
          if-no-files-found: error
      - name: Complete the fixed 80-campaign calibration census
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/audit_v3_attempts_v1.py run --profile ${{ matrix.profile }} --wave all --out workflow-results/audit
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: v3-attempt-audit-v1-compact-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/audit/compact
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: v3-attempt-audit-v1-full-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/audit
          retention-days: 90
          if-no-files-found: error
