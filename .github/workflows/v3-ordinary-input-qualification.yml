name: V3 ordinary input and graph extraction qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        placement: [colocated, split]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Verify frozen projection sources
        run: python scripts/verify_v3_ordinary_lock.py
      - name: Restore legacy source in trusted preparation role
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_petclinic_technical_learner.py --placement '${{ matrix.placement }}' --law NCD
      - name: Export only ordinary calibration fields
        run: |
          python -m telemetry_availability.v3_primary_projection --source workflow-input/learner --output workflow-results/ordinary --audit workflow-results/preparation/projection-audit.json
      - uses: actions/upload-artifact@v7
        with:
          name: v3-ordinary-${{ matrix.placement }}-NCD-${{ github.run_id }}
          path: workflow-results/ordinary
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-ordinary-preparation-${{ matrix.placement }}-NCD-${{ github.run_id }}
          path: |
            workflow-results/preparation
            workflow-results/source-artifact-audit.json
          retention-days: 90
          if-no-files-found: error
  inspect:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        placement: [colocated, split]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v8
        with:
          name: v3-ordinary-${{ matrix.placement }}-NCD-${{ github.run_id }}
          path: workflow-input/ordinary
      - name: Verify frozen consumer sources
        run: python scripts/verify_v3_ordinary_lock.py
      - name: Inventory only the physical ordinary role with enforced read boundary
        run: |
          mkdir -p workflow-results/compact
          /usr/bin/time -v -o workflow-results/compact/resource-usage.txt python -m telemetry_availability.v3_graph_input_inventory --input workflow-input/ordinary --output workflow-results/compact
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-ordinary-consumer-${{ matrix.placement }}-NCD-${{ github.run_id }}
          path: workflow-results/compact
          retention-days: 90
          if-no-files-found: error
