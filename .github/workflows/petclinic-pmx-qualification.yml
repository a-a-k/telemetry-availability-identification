name: Petclinic independent PMX database client qualification
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        placement:
        - colocated
        - split
        law:
        - N
        - NC
        - ND
        - NCD
    steps:
    - &id001
      uses: actions/checkout@v7
    - &id002
      uses: actions/setup-python@v7
      with:
        python-version: 3.13.15
    - &id003
      name: Install pinned environment and validate implementation
      run: 'python -m pip install -r requirements.txt

        python -m pip install --no-deps -e .

        python -m telemetry_availability.petclinic_pmx_qualification validate

        '
    - name: Restore exactly the declared learner source
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
      run: python scripts/restore_petclinic_technical_learner.py --placement '${{ matrix.placement }}' --law '${{ matrix.law }}'
    - name: Export a distinct native calibration role without our graph, health or parameters
      run: python scripts/prepare_petclinic_pmx_source.py
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: petclinic-pmx-source-${{ matrix.placement }}-${{ matrix.law }}-${{ github.run_id }}
        path: workflow-results/pmx-source
        if-no-files-found: error
        retention-days: 90
  extract:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        sample:
        - colocated-N
        - colocated-NC
        - colocated-ND
        - colocated-NCD
        - split-N
        - split-NC
        - split-ND
        - split-NCD
        - controls
    steps:
    - *id001
    - *id002
    - *id003
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '11'
    - uses: actions/download-artifact@v8
      if: ${{ matrix.sample != 'controls' }}
      with:
        name: petclinic-pmx-source-${{ matrix.sample }}-${{ github.run_id }}
        path: workflow-input/pmx-native
    - name: Obtain exact author PMX and options
      env:
        AUTHOR_BASE: https://se-gitlab-extern.fzi.de/SebastianWeberFZI/ableitung-von-leistungsmodellen-in-ci/-/raw/9b8d4c5707751eeabe31f7e7d6b7de0acf0c45a2
      run: 'mkdir -p workflow-input

        curl --fail --location --retry 8 --retry-all-errors "$AUTHOR_BASE/main.jar" --output workflow-input/main.jar

        curl --fail --location --retry 8 --retry-all-errors "$AUTHOR_BASE/Options.txt" --output workflow-input/Options.txt

        '
    - name: Project only native calibration calls and external calibration outcomes
      run: 'mkdir -p workflow-results/pmx-extraction

        /usr/bin/time -v -o workflow-results/pmx-extraction/projection-resource-usage.txt python -m telemetry_availability.petclinic_pmx_qualification
        prepare --source workflow-input/pmx-native --options workflow-input/Options.txt --out workflow-results/pmx-input --sample ''${{
        matrix.sample }}''

        '
    - name: Independently extract all operations and qualify native inventory
      run: /usr/bin/time -v -o workflow-results/pmx-extraction/extraction-resource-usage.txt python -m telemetry_availability.petclinic_pmx_qualification
        extract --contract workflow-results/pmx-input --sample '${{ matrix.sample }}' --jar workflow-input/main.jar --out workflow-results/pmx-extraction
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: petclinic-pmx-input-${{ matrix.sample }}-${{ github.run_id }}
        path: workflow-results/pmx-input
        if-no-files-found: error
        retention-days: 90
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: petclinic-pmx-extraction-${{ matrix.sample }}-${{ github.run_id }}
        path: workflow-results/pmx-extraction
        if-no-files-found: error
        retention-days: 90
  collect:
    needs: extract
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id003
    - uses: actions/download-artifact@v8
      with:
        pattern: petclinic-pmx-extraction-*-${{ github.run_id }}
        path: workflow-input/extractions
    - name: Census every model or extraction absence and seal supported models
      run: python -m telemetry_availability.petclinic_pmx_qualification collect --extractions workflow-input/extractions --out workflow-results/petclinic-pmx-contract
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: petclinic-pmx-solver-contract-${{ github.run_id }}
        path: workflow-results/petclinic-pmx-contract
        retention-days: 90
        if-no-files-found: error
  palladio_solver:
    name: Solve new DB controls and independent Petclinic models twice
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Check out study repository
      uses: actions/checkout@v7
    - name: Check out pinned Palladio reliability source
      uses: actions/checkout@v7
      with:
        repository: PalladioSimulator/Palladio-Analyzer-Reliability
        ref: a694e570afb705dc9e0470dc321e77b7219dcea4
        path: palladio-source
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.13.15
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Set up pinned Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Install dependencies and validate the frozen contract
      run: "python -m pip install --upgrade pip\npython -m pip install -r requirements.txt\npython -m pip install --no-deps -e .\npython\
        \ -m telemetry_availability.pmx_context_comparison validate\ntest \"$(git -C palladio-source rev-parse HEAD)\" = \\\n  \"a694e570afb705dc9e0470dc321e77b7219dcea4\"\
        \n"
    - name: Download the retained artificial PCM contract
      uses: actions/download-artifact@v8
      with:
        name: petclinic-pmx-solver-contract-${{ github.run_id }}
        path: workflow-input/petclinic-pmx-contract
    - name: Record actual model count including extraction abstentions
      run: echo "PETCLINIC_PMX_MODEL_COUNT=$(jq -r .model_count workflow-input/petclinic-pmx-contract/solver-contract.json)" >> "$GITHUB_ENV"
    - name: Reconstruct and audit the accepted release-date target platform
      run: "petclinic_pmx_maven_repo=\"${RUNNER_TEMP}/petclinic-pmx-maven-repository\"\nevidence_dir=\"workflow-results/petclinic-pmx-solver/target-lock/repository\"\
        \nmkdir -p \"$petclinic_pmx_maven_repo\" \"$evidence_dir\"\ncoordinate=\"$(jq -r '.target_platform_lock.coordinate' configs/m9a_palladio_bootstrap.json)\"\
        \nmvn -B -ntp \"-Dmaven.repo.local=${petclinic_pmx_maven_repo}\" \\\n  dependency:get \"-Dartifact=${coordinate}\"\ntarget_file=\"\
        ${petclinic_pmx_maven_repo}/org/palladiosimulator/palladio-target-platforms/0.1.0/palladio-target-platforms-0.1.0-palladio-2023-03.target\"\
        \nrepository_url=\"$(jq -r '.target_platform_lock.pinned_repository_url' configs/m9a_palladio_bootstrap.json)\"\nwhile IFS=\
        \ read -r relative_path; do\n  mkdir -p \"${evidence_dir}/$(dirname \"$relative_path\")\"\n  curl --fail --location --retry\
        \ 5 --retry-all-errors \\\n    --output \"${evidence_dir}/${relative_path}\" \\\n    \"${repository_url}${relative_path}\"\n\
        done < <(jq -r '.target_platform_lock.repository_evidence[].relative_path' configs/m9a_palladio_bootstrap.json)\npython -m telemetry_availability\
        \ lock-palladio-target-platform \\\n  --config configs/m9a_palladio_bootstrap.json \\\n  --target-file \"$target_file\" \\\n\
        \  --repository-evidence-dir \"$evidence_dir\" \\\n  --out workflow-results/petclinic-pmx-solver/target-lock/manifest.json\n\
        echo \"PETCLINIC_PMX_MAVEN_REPO=${petclinic_pmx_maven_repo}\" >> \"$GITHUB_ENV\"\ngit -C palladio-source diff --exit-code\n"
    - name: Reconfirm the accepted analyzer capability boundary
      run: python -m telemetry_availability audit-palladio-capability-source --config configs/m9b_palladio_semantic_controls.json --analyzer-checkout
        palladio-source --out workflow-results/petclinic-pmx-solver/capability-manifest.json
    - name: Overlay versioned generic harness with per-case StackOverflowError records
      run: "test_bundle=\"palladio-source/tests/org.palladiosimulator.reliability.tests\"\ncp palladio/harness/META-INF/MANIFEST.MF\
        \ \"$test_bundle/META-INF/MANIFEST.MF\"\ncp palladio/harness/src/org/palladiosimulator/reliability/tests/PmxContextBridgeTest.java\
        \ \\\n  \"$test_bundle/src/org/palladiosimulator/reliability/tests/PmxContextBridgeTest.java\"\ngit -C palladio-source status\
        \ --short > workflow-results/petclinic-pmx-solver/harness-overlay.txt\ntest \"$(git -C palladio-source diff --name-only)\" =\
        \ \\\n  \"tests/org.palladiosimulator.reliability.tests/META-INF/MANIFEST.MF\"\ntest \"$(git -C palladio-source ls-files --others\
        \ --exclude-standard)\" = \\\n  \"tests/org.palladiosimulator.reliability.tests/src/org/palladiosimulator/reliability/tests/PmxContextBridgeTest.java\"\
        \n"
    - name: Build the pinned analyzer without running the aligned experiment
      run: "mkdir -p workflow-results/petclinic-pmx-solver/runtime\njava -version > workflow-results/petclinic-pmx-solver/runtime/java-version.txt\
        \ 2>&1\nmvn -version > workflow-results/petclinic-pmx-solver/runtime/maven-version.txt 2>&1\nlscpu > workflow-results/petclinic-pmx-solver/runtime/runner-cpu.txt\n\
        free -b > workflow-results/petclinic-pmx-solver/runtime/runner-memory.txt\nset -o pipefail\n/usr/bin/time -v -o workflow-results/petclinic-pmx-solver/runtime/build-resource-usage.txt\
        \ \\\n  xvfb-run -a mvn -B -ntp \"-Dmaven.repo.local=${PETCLINIC_PMX_MAVEN_REPO}\" \\\n    -DskipTests=true -f palladio-source/pom.xml\
        \ clean verify \\\n  2>&1 | tee workflow-results/petclinic-pmx-solver/runtime/build.log\ntest \"${PIPESTATUS[0]}\" -eq 0\n"
    - name: Solve every supported model twice
      env:
        TAID_PALLADIO_ALIGNED_ROOT: ${{ github.workspace }}/workflow-input/petclinic-pmx-contract/models
        TAID_PALLADIO_RESULT: ${{ github.workspace }}/workflow-results/petclinic-pmx-solver/raw-result.json
        TAID_REPEAT_RUNS: '2'
        TAID_EXPECTED_MODEL_COUNT: ${{ env.PETCLINIC_PMX_MODEL_COUNT }}
        TAID_EXPECTED_CASE_COUNT: ${{ env.PETCLINIC_PMX_MODEL_COUNT }}
        TAID_PROBABILITY_TOLERANCE: 1e-12
      run: "set -o pipefail\n/usr/bin/time -v -o workflow-results/petclinic-pmx-solver/runtime/solve-resource-usage.txt \\\n  xvfb-run\
        \ -a mvn -B -ntp \"-Dmaven.repo.local=${PETCLINIC_PMX_MAVEN_REPO}\" \\\n    -f palladio-source/pom.xml verify \\\n  2>&1 | tee\
        \ workflow-results/petclinic-pmx-solver/runtime/solve.log\ntest \"${PIPESTATUS[0]}\" -eq 0\n"
      if: ${{ env.PETCLINIC_PMX_MODEL_COUNT != '0' }}
    - name: Collect test reports
      if: ${{ always() }}
      run: "report_root=\"palladio-source/tests/org.palladiosimulator.reliability.tests/target/surefire-reports\"\nif [[ -d \"$report_root\"\
        \ ]]; then\n  cp -R \"$report_root\" workflow-results/petclinic-pmx-solver/surefire-reports\nfi\n"
    - name: Retain raw untuned solver output and timing
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: petclinic-pmx-solver-${{ github.run_id }}
        path: workflow-results/petclinic-pmx-solver
        if-no-files-found: error
        retention-days: 90
  freeze:
    needs: palladio_solver
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - *id001
    - *id002
    - *id003
    - uses: actions/download-artifact@v8
      with:
        name: petclinic-pmx-solver-contract-${{ github.run_id }}
        path: workflow-input/contract
    - uses: actions/download-artifact@v8
      with:
        name: petclinic-pmx-solver-${{ github.run_id }}
        path: workflow-input/solver
    - name: Require eight known-probability passes then freeze all 64 operation-variant slots
      run: python -m telemetry_availability.petclinic_pmx_qualification freeze --contract workflow-input/contract --solver workflow-input/solver
        --out workflow-results/candidates
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: petclinic-pmx-candidates-${{ github.run_id }}
        path: workflow-results/candidates
        retention-days: 90
        if-no-files-found: error
