name: M9O independent temporal confirmation design

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: m9o-temporal-confirmation-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIG: configs/m9o_temporal_confirmation.json
  PYTHON_VERSION: 3.13.15

jobs:
  pilot_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install and validate frozen design
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m telemetry_availability.temporal_confirmation_design validate --config "$CONFIG"
      - name: Download only locked M9N derived artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p workflow-input/m9o
          for role in candidates evaluation; do
            artifact_id="$(jq -r ".artifacts.${role}.id" "$CONFIG")"
            artifact_name="$(jq -r ".artifacts.${role}.name" "$CONFIG")"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "workflow-input/m9o/${role}-metadata.json"
            gh run download 34111689492 --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "workflow-input/m9o/$role"
          done
      - name: Audit provenance and seal pilot inputs
        run: |
          mkdir -p workflow-results/m9o-contract
          /usr/bin/time -v -o workflow-results/m9o-contract/resource-usage.txt python -m telemetry_availability.temporal_confirmation_design contract \
            --config "$CONFIG" --input workflow-input/m9o --out workflow-results/m9o-contract
      - uses: actions/upload-artifact@v7
        with:
          name: m9o-pilot-contract-${{ github.run_id }}
          path: workflow-results/m9o-contract
          if-no-files-found: error
          retention-days: 90

  precision_plan:
    needs: [pilot_contract]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v8
        with:
          name: m9o-pilot-contract-${{ github.run_id }}
          path: workflow-input/m9o-contract
      - name: Apply frozen precision rule and reserve prospective identities
        run: |
          mkdir -p workflow-results/m9o-design
          /usr/bin/time -v -o workflow-results/m9o-design/resource-usage.txt python -m telemetry_availability.temporal_confirmation_design plan \
            --config "$CONFIG" --input workflow-input/m9o-contract --out workflow-results/m9o-design
      - uses: actions/upload-artifact@v7
        with:
          name: m9o-confirmation-design-${{ github.run_id }}
          path: workflow-results/m9o-design
          if-no-files-found: error
          retention-days: 90

  design_audit:
    needs: [precision_plan]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v8
        with:
          name: m9o-confirmation-design-${{ github.run_id }}
          path: workflow-input/m9o-design
      - name: Audit published design arithmetic and collection boundary
        run: |
          mkdir -p workflow-results/m9o-audit
          /usr/bin/time -v -o workflow-results/m9o-audit/resource-usage.txt python -m telemetry_availability.temporal_confirmation_design audit \
            --config "$CONFIG" --input workflow-input/m9o-design --out workflow-results/m9o-audit
      - uses: actions/upload-artifact@v7
        with:
          name: m9o-confirmation-audit-${{ github.run_id }}
          path: workflow-results/m9o-audit
          if-no-files-found: error
          retention-days: 90
