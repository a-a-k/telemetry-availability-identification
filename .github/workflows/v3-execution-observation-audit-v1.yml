name: V3 ordinary execution observation audit v1
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [deathstarbench_social_network, opentelemetry_demo, spring_petclinic_microservices]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p workflow-results/compact
          /usr/bin/time -v -o workflow-results/compact/preparation-resource-usage.txt python scripts/v3_execution_observation_audit_v1.py prepare --profile '${{ matrix.profile }}'
      - run: /usr/bin/time -v -o workflow-results/compact/audit-resource-usage.txt python -m telemetry_availability.v3_execution_observation_audit_v1 --input workflow-input/ordinary --output workflow-results/compact --operations ${{ steps.prepare.outputs.operations }}
      - run: python scripts/v3_execution_observation_audit_v1.py report --profile '${{ matrix.profile }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-execution-audit-compact-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/compact
          retention-days: 90
          if-no-files-found: error
