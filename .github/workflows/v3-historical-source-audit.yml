name: V3 historical source audit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/audit_v3_historical_sources.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-historical-source-audit-${{ github.run_id }}
          path: workflow-results/v3-historical-source-audit
          retention-days: 90
          if-no-files-found: error
