name: M7A Fault and Trace-Linkage Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: m7a-fault-acquisition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: ${{ matrix.profile }} / ${{ matrix.law }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - profile: deathstarbench_social_network
            law: N
            repository: delimitrou/DeathStarBench
            commit: 6ecb09706140f8730b5385c08f1386c654c3c526
            compose_file: socialNetwork/docker-compose.yml
          - profile: deathstarbench_social_network
            law: NC
            repository: delimitrou/DeathStarBench
            commit: 6ecb09706140f8730b5385c08f1386c654c3c526
            compose_file: socialNetwork/docker-compose.yml
          - profile: deathstarbench_social_network
            law: ND
            repository: delimitrou/DeathStarBench
            commit: 6ecb09706140f8730b5385c08f1386c654c3c526
            compose_file: socialNetwork/docker-compose.yml
          - profile: deathstarbench_social_network
            law: NCD
            repository: delimitrou/DeathStarBench
            commit: 6ecb09706140f8730b5385c08f1386c654c3c526
            compose_file: socialNetwork/docker-compose.yml
          - profile: opentelemetry_demo
            law: N
            repository: open-telemetry/opentelemetry-demo
            commit: 8c47d47c9ac27710d2b2a153bcd53e483bffe66d
            compose_file: compose.yaml
          - profile: opentelemetry_demo
            law: NC
            repository: open-telemetry/opentelemetry-demo
            commit: 8c47d47c9ac27710d2b2a153bcd53e483bffe66d
            compose_file: compose.yaml
          - profile: opentelemetry_demo
            law: ND
            repository: open-telemetry/opentelemetry-demo
            commit: 8c47d47c9ac27710d2b2a153bcd53e483bffe66d
            compose_file: compose.yaml
          - profile: opentelemetry_demo
            law: NCD
            repository: open-telemetry/opentelemetry-demo
            commit: 8c47d47c9ac27710d2b2a153bcd53e483bffe66d
            compose_file: compose.yaml

    steps:
      - name: Check out experiment repository
        uses: actions/checkout@v7

      - name: Check out exact benchmark revision
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Record runner resources
        run: |
          mkdir -p "workflow-results/${{ matrix.profile }}/${{ matrix.law }}/r0"
          uname -a > "workflow-results/${{ matrix.profile }}/${{ matrix.law }}/r0/runner.txt"
          docker version >> "workflow-results/${{ matrix.profile }}/${{ matrix.law }}/r0/runner.txt"
          docker compose version >> "workflow-results/${{ matrix.profile }}/${{ matrix.law }}/r0/runner.txt"
          free -h >> "workflow-results/${{ matrix.profile }}/${{ matrix.law }}/r0/runner.txt"
          df -h >> "workflow-results/${{ matrix.profile }}/${{ matrix.law }}/r0/runner.txt"

      - name: Render and digest-lock Compose
        env:
          DEMO_VERSION: "3.0.0"
          LOCUST_AUTOSTART: "false"
          LOCUST_HEADLESS: "true"
          LOCUST_BROWSER_TRAFFIC_ENABLED: "false"
        run: |
          out="workflow-results/${{ matrix.profile }}/${{ matrix.law }}/r0"
          if [[ "${{ matrix.profile }}" == "opentelemetry_demo" ]]; then
            export OTEL_COLLECTOR_CONFIG_EXTRAS="$GITHUB_WORKSPACE/configs/live/otel-pilot-collector-extra.yml"
            docker compose --env-file upstream/.env -f "upstream/${{ matrix.compose_file }}" config --format json > "$out/rendered-compose.json"
            telemetry_args=(--telemetry-output-directory "$GITHUB_WORKSPACE/$out")
          else
            docker compose -f "upstream/${{ matrix.compose_file }}" config --format json > "$out/rendered-compose.json"
            telemetry_args=()
          fi
          python -m telemetry_availability pin-live-compose \
            --config configs/m7_runtime_pilot.yaml \
            --profile "${{ matrix.profile }}" \
            --input "$out/rendered-compose.json" \
            --out "$out/pinned-compose.json" \
            --audit "$out/image-lock-audit.json" \
            "${telemetry_args[@]}"

      - name: Pull and start the frozen benchmark
        run: |
          compose="workflow-results/${{ matrix.profile }}/${{ matrix.law }}/r0/pinned-compose.json"
          docker compose -f "$compose" pull
          docker compose -f "$compose" up -d --no-build --wait --wait-timeout 360

      - name: Run predeclared fault and trace-linkage diagnostic
        run: >-
          python -m telemetry_availability run-live-fault-diagnostic
          --config configs/m7a_fault_acquisition.yaml
          --profile "${{ matrix.profile }}"
          --law "${{ matrix.law }}"
          --repetition 0
          --checkout upstream
          --compose "workflow-results/${{ matrix.profile }}/${{ matrix.law }}/r0/pinned-compose.json"
          --image-audit "workflow-results/${{ matrix.profile }}/${{ matrix.law }}/r0/image-lock-audit.json"
          --out "workflow-results/${{ matrix.profile }}/${{ matrix.law }}/r0"

      - name: Capture service diagnostics
        if: ${{ always() }}
        run: |
          out="workflow-results/${{ matrix.profile }}/${{ matrix.law }}/r0"
          docker compose -f "$out/pinned-compose.json" ps --format json > "$out/compose-ps.json" || true
          docker compose -f "$out/pinned-compose.json" logs --no-color > "$out/compose.log" 2>&1 || true
          docker stats --no-stream --format '{{json .}}' > "$out/docker-stats.jsonl" || true

      - name: Upload immutable diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: m7a-${{ matrix.profile }}-${{ matrix.law }}-r0-${{ github.run_id }}
          path: workflow-results/${{ matrix.profile }}/${{ matrix.law }}/r0
          if-no-files-found: error
          retention-days: 30

      - name: Tear down benchmark
        if: ${{ always() }}
        run: >-
          docker compose
          -f "workflow-results/${{ matrix.profile }}/${{ matrix.law }}/r0/pinned-compose.json"
          down --volumes --remove-orphans || true

  aggregate:
    name: Aggregate M7A diagnostic evidence
    if: ${{ always() }}
    needs: diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out experiment repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Download all diagnostic cells
        uses: actions/download-artifact@v8
        with:
          pattern: m7a-*-${{ github.run_id }}
          path: workflow-shards

      - name: Aggregate complete diagnostic matrix
        run: >-
          python -m telemetry_availability aggregate-live-fault-diagnostics
          --config configs/m7a_fault_acquisition.yaml
          --input-root workflow-shards
          --out workflow-results/aggregate

      - name: Upload aggregate
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: m7a-aggregate-${{ github.run_id }}
          path: workflow-results/aggregate
          if-no-files-found: warn
          retention-days: 30
