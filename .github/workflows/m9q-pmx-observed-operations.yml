name: M9Q PMX observed-operation adapter conformance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: m9q-pmx-observed-operations-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIG: configs/m9q_pmx_observed_operations.json
  PYTHON_VERSION: 3.13.15
  JAVA_VERSION: "11"
  AUTHOR_BASE: https://se-gitlab-extern.fzi.de/SebastianWeberFZI/ableitung-von-leistungsmodellen-in-ci/-/raw/9b8d4c5707751eeabe31f7e7d6b7de0acf0c45a2

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install exact dependencies and verify source locks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m telemetry_availability.pmx_adapter_conformance validate --config "$CONFIG"
          python -m unittest discover -s tests -p 'test_pmx_*conformance.py' -q
          python -m unittest discover -s tests -p test_pmx_observed_operations.py -q
      - name: Obtain the unchanged author binary and options
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workflow-input/m9q workflow-results/m9q
          curl --fail --location --retry 8 --retry-all-errors "$AUTHOR_BASE/main.jar" --output workflow-input/m9q/main.jar
          curl --fail --location --retry 8 --retry-all-errors "$AUTHOR_BASE/Options.txt" --output workflow-input/m9q/Options.txt
          echo 'befe481ab6f9db9d7b283a2ca810b9ec11a368e4ddc8cb6c669b73590d431013  workflow-input/m9q/main.jar' | sha256sum --check
          echo '7cd828213521e1a608938b05a8c2899556652d093624bde1afbaf9e5dacc597d  workflow-input/m9q/Options.txt' | sha256sum --check
          java -version > workflow-results/m9q/java-version.txt 2>&1
      - name: Freeze artificial adapter inputs and independent oracles
        shell: bash
        run: |
          set -euo pipefail
          python -m telemetry_availability.pmx_adapter_conformance build --config "$CONFIG" --options workflow-input/m9q/Options.txt --out workflow-results/m9q/contract
      - name: Retain the contract before extractor execution
        uses: actions/upload-artifact@v7
        with:
          name: m9q-adapter-contract-${{ github.run_id }}-a${{ github.run_attempt }}
          path: workflow-results/m9q/contract
          if-no-files-found: error
          retention-days: 90
      - name: Run the three fixed cases twice and resolve PCM references
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v -o workflow-results/m9q/conformance-resource-usage.txt python -m telemetry_availability.pmx_adapter_conformance execute --config "$CONFIG" --contract workflow-results/m9q/contract --jar workflow-input/m9q/main.jar --out workflow-results/m9q/probe
      - name: Retain every conformance attempt and decision
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: m9q-adapter-conformance-${{ github.run_id }}-a${{ github.run_attempt }}
          path: workflow-results/m9q
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
