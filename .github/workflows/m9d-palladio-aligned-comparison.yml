name: M9D Palladio Aligned-Input Comparison

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: m9d-palladio-aligned-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aligned_input_contract:
    name: Audit M7 evidence, recover learner-only fits, and generate PCM
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out study repository
        uses: actions/checkout@v7

      - name: Set up frozen M7 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned analysis dependencies and validate M9D
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m telemetry_availability validate-palladio-aligned-comparison \
            --config configs/m9d_palladio_aligned_comparison.json

      - name: Capture exact accepted artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metadata_root="workflow-input/m9d/metadata"
          mkdir -p "$metadata_root"
          for key in m8a_preserved_evidence m8a_integrity_audit m9c_contract m9c_solver m9c_acceptance; do
            artifact_id="$(jq -r ".evidence.${key}.artifact_id" configs/m9d_palladio_aligned_comparison.json)"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
              > "${metadata_root}/${key}.json"
          done

      - name: Download byte-locked M7/M8A and accepted M9C inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          config="configs/m9d_palladio_aligned_comparison.json"
          download_one() {
            key="$1"
            destination="$2"
            run_id="$(jq -r ".evidence.${key}.run_id" "$config")"
            artifact_name="$(jq -r ".evidence.${key}.artifact_name" "$config")"
            mkdir -p "$destination"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" --dir "$destination"
          }
          download_one m8a_preserved_evidence workflow-input/m9d/m8a-source
          download_one m8a_integrity_audit workflow-input/m9d/m8a-audit
          download_one m9c_contract workflow-input/m9d/m9c-contract
          download_one m9c_acceptance workflow-input/m9d/m9c-acceptance

      - name: Audit accepted evidence, locks, and every preserved source file
        run: |
          mkdir -p workflow-results/m9d-contract/evidence
          set -o pipefail
          /usr/bin/time -v -o workflow-results/m9d-contract/evidence/resource-usage.txt \
            python -m telemetry_availability audit-palladio-aligned-evidence \
              --config configs/m9d_palladio_aligned_comparison.json \
              --m8a-preserved-metadata workflow-input/m9d/metadata/m8a_preserved_evidence.json \
              --m8a-audit-metadata workflow-input/m9d/metadata/m8a_integrity_audit.json \
              --m9c-contract-metadata workflow-input/m9d/metadata/m9c_contract.json \
              --m9c-solver-metadata workflow-input/m9d/metadata/m9c_solver.json \
              --m9c-acceptance-metadata workflow-input/m9d/metadata/m9c_acceptance.json \
              --qualified-root workflow-input/m9d/m8a-source/m8-preserved/qualified \
              --analysis-root workflow-input/m9d/m8a-source/m8-preserved/analysis \
              --raw-root workflow-input/m9d/m8a-source/m8-preserved/raw-audit-samples \
              --audit-root workflow-input/m9d/m8a-audit \
              --m9c-contract-root workflow-input/m9d/m9c-contract \
              --m9c-acceptance-root workflow-input/m9d/m9c-acceptance \
              --repository-root . \
              --out workflow-results/m9d-contract/evidence \
            2>&1 | tee workflow-results/m9d-contract/evidence/audit.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Stage a physically learner-only input tree
        run: >-
          python -m telemetry_availability stage-palladio-aligned-learner-input
          --config configs/m9d_palladio_aligned_comparison.json
          --qualified-root workflow-input/m9d/m8a-source/m8-preserved/qualified
          --out workflow-input/m9d/learner-only

      - name: Seal prediction-only replay reference and remove evaluator inputs
        run: |
          source_analysis="workflow-input/m9d/m8a-source/m8-preserved/analysis"
          prediction_root="workflow-input/m9d/frozen-predictions"
          mkdir -p "$prediction_root"
          cp "$source_analysis/manifest.json" "$prediction_root/manifest.json"
          cp "$source_analysis/predictions.csv" "$prediction_root/predictions.csv"
          rm -rf \
            workflow-input/m9d/m8a-source \
            workflow-input/m9d/m8a-audit \
            workflow-input/m9d/m9c-contract \
            workflow-input/m9d/m9c-acceptance \
            workflow-input/m9d/metadata
          test "$(find "$prediction_root" -type f | wc -l)" -eq 2
          test ! -e workflow-input/m9d/m8a-source

      - name: Recover frozen fit realizations and generate all admitted PCM models
        run: |
          mkdir -p workflow-results/m9d-contract/runtime
          lscpu > workflow-results/m9d-contract/runtime/runner-cpu.txt
          free -b > workflow-results/m9d-contract/runtime/runner-memory.txt
          set -o pipefail
          /usr/bin/time -v -o workflow-results/m9d-contract/runtime/preparation-resource-usage.txt \
            python -m telemetry_availability prepare-palladio-aligned-models \
              --config configs/m9d_palladio_aligned_comparison.json \
              --learner-root workflow-input/m9d/learner-only \
              --analysis-root workflow-input/m9d/frozen-predictions \
              --evidence-manifest workflow-results/m9d-contract/evidence/evidence-manifest.json \
              --models workflow-results/m9d-contract/models \
              --out workflow-results/m9d-contract \
            2>&1 | tee workflow-results/m9d-contract/runtime/preparation.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Retain the exact aligned-input contract and PCM models
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: m9d-palladio-aligned-contract-${{ github.run_id }}
          path: workflow-results/m9d-contract
          if-no-files-found: error
          retention-days: 90

  palladio_solver:
    name: Solve all admitted aligned-input PCM models twice
    needs: aligned_input_contract
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out study repository
        uses: actions/checkout@v7

      - name: Check out pinned Palladio reliability source
        uses: actions/checkout@v7
        with:
          repository: PalladioSimulator/Palladio-Analyzer-Reliability
          ref: a694e570afb705dc9e0470dc321e77b7219dcea4
          path: palladio-source

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up pinned Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies and validate the frozen contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m telemetry_availability validate-palladio-aligned-comparison \
            --config configs/m9d_palladio_aligned_comparison.json
          test "$(git -C palladio-source rev-parse HEAD)" = \
            "a694e570afb705dc9e0470dc321e77b7219dcea4"

      - name: Download the audited learner-only PCM contract
        uses: actions/download-artifact@v8
        with:
          name: m9d-palladio-aligned-contract-${{ github.run_id }}
          path: workflow-input/m9d-contract

      - name: Reconstruct and audit the accepted release-date target platform
        run: |
          m9d_maven_repo="${RUNNER_TEMP}/m9d-maven-repository"
          evidence_dir="workflow-results/m9d-solver/target-lock/repository"
          mkdir -p "$m9d_maven_repo" "$evidence_dir"
          coordinate="$(jq -r '.target_platform_lock.coordinate' configs/m9a_palladio_bootstrap.json)"
          mvn -B -ntp "-Dmaven.repo.local=${m9d_maven_repo}" \
            dependency:get "-Dartifact=${coordinate}"
          target_file="${m9d_maven_repo}/org/palladiosimulator/palladio-target-platforms/0.1.0/palladio-target-platforms-0.1.0-palladio-2023-03.target"
          repository_url="$(jq -r '.target_platform_lock.pinned_repository_url' configs/m9a_palladio_bootstrap.json)"
          while IFS= read -r relative_path; do
            mkdir -p "${evidence_dir}/$(dirname "$relative_path")"
            curl --fail --location --retry 5 --retry-all-errors \
              --output "${evidence_dir}/${relative_path}" \
              "${repository_url}${relative_path}"
          done < <(jq -r '.target_platform_lock.repository_evidence[].relative_path' configs/m9a_palladio_bootstrap.json)
          python -m telemetry_availability lock-palladio-target-platform \
            --config configs/m9a_palladio_bootstrap.json \
            --target-file "$target_file" \
            --repository-evidence-dir "$evidence_dir" \
            --out workflow-results/m9d-solver/target-lock/manifest.json
          echo "M9D_MAVEN_REPO=${m9d_maven_repo}" >> "$GITHUB_ENV"
          git -C palladio-source diff --exit-code

      - name: Reconfirm the accepted analyzer capability boundary
        run: >-
          python -m telemetry_availability audit-palladio-capability-source
          --config configs/m9b_palladio_semantic_controls.json
          --analyzer-checkout palladio-source
          --out workflow-results/m9d-solver/capability-manifest.json

      - name: Overlay only the audited generic M9D harness
        run: |
          test_bundle="palladio-source/tests/org.palladiosimulator.reliability.tests"
          cp palladio/harness/META-INF/MANIFEST.MF "$test_bundle/META-INF/MANIFEST.MF"
          cp palladio/harness/src/org/palladiosimulator/reliability/tests/AlignedComparisonTest.java \
            "$test_bundle/src/org/palladiosimulator/reliability/tests/AlignedComparisonTest.java"
          git -C palladio-source status --short > workflow-results/m9d-solver/harness-overlay.txt
          test "$(git -C palladio-source diff --name-only)" = \
            "tests/org.palladiosimulator.reliability.tests/META-INF/MANIFEST.MF"
          test "$(git -C palladio-source ls-files --others --exclude-standard)" = \
            "tests/org.palladiosimulator.reliability.tests/src/org/palladiosimulator/reliability/tests/AlignedComparisonTest.java"

      - name: Build the pinned analyzer without running the aligned experiment
        run: |
          mkdir -p workflow-results/m9d-solver/runtime
          java -version > workflow-results/m9d-solver/runtime/java-version.txt 2>&1
          mvn -version > workflow-results/m9d-solver/runtime/maven-version.txt 2>&1
          lscpu > workflow-results/m9d-solver/runtime/runner-cpu.txt
          free -b > workflow-results/m9d-solver/runtime/runner-memory.txt
          set -o pipefail
          /usr/bin/time -v -o workflow-results/m9d-solver/runtime/build-resource-usage.txt \
            xvfb-run -a mvn -B -ntp "-Dmaven.repo.local=${M9D_MAVEN_REPO}" \
              -DskipTests=true -f palladio-source/pom.xml clean verify \
            2>&1 | tee workflow-results/m9d-solver/runtime/build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Warm once and run all 184 models in two measured passes
        env:
          TAID_PALLADIO_ALIGNED_ROOT: ${{ github.workspace }}/workflow-input/m9d-contract/models
          TAID_PALLADIO_RESULT: ${{ github.workspace }}/workflow-results/m9d-solver/raw-result.json
          TAID_REPEAT_RUNS: "2"
          TAID_EXPECTED_MODEL_COUNT: "184"
          TAID_EXPECTED_CASE_COUNT: "184"
          TAID_PROBABILITY_TOLERANCE: "1e-12"
        run: |
          set -o pipefail
          /usr/bin/time -v -o workflow-results/m9d-solver/runtime/solve-resource-usage.txt \
            xvfb-run -a mvn -B -ntp "-Dmaven.repo.local=${M9D_MAVEN_REPO}" \
              -f palladio-source/pom.xml verify \
            2>&1 | tee workflow-results/m9d-solver/runtime/solve.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Collect test reports
        if: ${{ always() }}
        run: |
          report_root="palladio-source/tests/org.palladiosimulator.reliability.tests/target/surefire-reports"
          if [[ -d "$report_root" ]]; then
            cp -R "$report_root" workflow-results/m9d-solver/surefire-reports
          fi

      - name: Retain raw untuned solver output and timing
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: m9d-palladio-solver-${{ github.run_id }}
          path: workflow-results/m9d-solver
          if-no-files-found: error
          retention-days: 90

  acceptance_and_scoring:
    name: Audit bridge fidelity, coverage, held-out accuracy, and cost
    needs: [aligned_input_contract, palladio_solver]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out study repository
        uses: actions/checkout@v7

      - name: Set up frozen M7 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and validate M9D
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m telemetry_availability validate-palladio-aligned-comparison \
            --config configs/m9d_palladio_aligned_comparison.json

      - name: Download the fixed model contract and raw solver result
        uses: actions/download-artifact@v8
        with:
          name: m9d-palladio-aligned-contract-${{ github.run_id }}
          path: workflow-input/m9d-contract

      - name: Download raw solver output separately
        uses: actions/download-artifact@v8
        with:
          name: m9d-palladio-solver-${{ github.run_id }}
          path: workflow-input/m9d-solver

      - name: Re-download preserved evaluator evidence only after solving
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          config="configs/m9d_palladio_aligned_comparison.json"
          mkdir -p workflow-input/m9d-score/metadata workflow-input/m9d-score/m8a-source workflow-input/m9d-score/m8a-audit
          for key in m8a_preserved_evidence m8a_integrity_audit; do
            artifact_id="$(jq -r ".evidence.${key}.artifact_id" "$config")"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
              > "workflow-input/m9d-score/metadata/${key}.json"
          done
          source_run="$(jq -r '.evidence.m8a_preserved_evidence.run_id' "$config")"
          source_name="$(jq -r '.evidence.m8a_preserved_evidence.artifact_name' "$config")"
          audit_run="$(jq -r '.evidence.m8a_integrity_audit.run_id' "$config")"
          audit_name="$(jq -r '.evidence.m8a_integrity_audit.artifact_name' "$config")"
          gh run download "$source_run" --repo "$GITHUB_REPOSITORY" \
            --name "$source_name" --dir workflow-input/m9d-score/m8a-source
          gh run download "$audit_run" --repo "$GITHUB_REPOSITORY" \
            --name "$audit_name" --dir workflow-input/m9d-score/m8a-audit

      - name: Run downstream technical acceptance and descriptive scoring
        run: |
          mkdir -p workflow-results/m9d-acceptance/runtime
          lscpu > workflow-results/m9d-acceptance/runtime/runner-cpu.txt
          free -b > workflow-results/m9d-acceptance/runtime/runner-memory.txt
          set -o pipefail
          /usr/bin/time -v -o workflow-results/m9d-acceptance/runtime/audit-resource-usage.txt \
            python -m telemetry_availability audit-palladio-aligned-results \
              --config configs/m9d_palladio_aligned_comparison.json \
              --contract workflow-input/m9d-contract \
              --result workflow-input/m9d-solver/raw-result.json \
              --qualified-root workflow-input/m9d-score/m8a-source/m8-preserved/qualified \
              --analysis-root workflow-input/m9d-score/m8a-source/m8-preserved/analysis \
              --audit-root workflow-input/m9d-score/m8a-audit \
              --m8a-preserved-metadata workflow-input/m9d-score/metadata/m8a_preserved_evidence.json \
              --m8a-audit-metadata workflow-input/m9d-score/metadata/m8a_integrity_audit.json \
              --out workflow-results/m9d-acceptance \
            2>&1 | tee workflow-results/m9d-acceptance/runtime/audit.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Retain accepted fidelity, coverage, scores, and resource evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: m9d-palladio-acceptance-${{ github.run_id }}
          path: workflow-results/m9d-acceptance
          if-no-files-found: error
          retention-days: 90
