name: V3 clock-qualified main evidence retention

on:
  workflow_run:
    workflows: [V3 prospective comparison v3]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact completed admitted main run ID
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: v3-main-771601-v3-evidence-retention
  cancel-in-progress: false

jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Retain only the recorded admitted main and export its existing metrics
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETED_RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: python scripts/continue_v3_comparison_remote_v2.py collect --run "$COMPLETED_RUN"
      - name: Preserve compact main evidence even if an audit or push fails
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: v3-main-retention-${{ github.run_id }}
          path: |
            docs/evidence/v3-comparison-main-*/
            docs/tables/v3-main-*/
            docs/milestones/V3_MAIN_COLLECTION_V2_RESULT.md
          if-no-files-found: warn
          retention-days: 90
