name: Petclinic technical graph observation build and replay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        placement: [colocated, split]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - run: python scripts/verify_petclinic_graph_observation_lock.py
      - name: Restore only the pinned ordinary role
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_v3_ordinary_bundle.py --placement '${{ matrix.placement }}'
      - name: Build graph and estimate joint observation law
        run: |
          mkdir -p workflow-results/fit
          /usr/bin/time -v -o workflow-results/fit/resource-usage.txt python -m telemetry_availability.petclinic_graph_observation_fit --input workflow-input/ordinary --models workflow-results/models --reports workflow-results/fit
      - uses: actions/upload-artifact@v7
        with:
          name: petclinic-graph-model-${{ matrix.placement }}-${{ github.run_id }}
          path: workflow-results/models
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: petclinic-graph-fit-${{ matrix.placement }}-${{ github.run_id }}
          path: workflow-results/fit
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: petclinic-graph-source-${{ matrix.placement }}-${{ github.run_id }}
          path: workflow-results/source
          retention-days: 90
          if-no-files-found: error
  replay:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        placement: [colocated, split]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - run: python scripts/verify_petclinic_graph_observation_lock.py
      - uses: actions/download-artifact@v8
        with:
          name: petclinic-graph-model-${{ matrix.placement }}-${{ github.run_id }}
          path: workflow-input/model
      - name: Replay only the saved model and check graph structure
        run: |
          mkdir -p workflow-results/replay
          /usr/bin/time -v -o workflow-results/replay/resource-usage.txt python -m telemetry_availability.petclinic_graph_observation_fit --input workflow-input/model --reports workflow-results/replay --replay
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: petclinic-graph-replay-${{ matrix.placement }}-${{ github.run_id }}
          path: workflow-results/replay
          retention-days: 90
          if-no-files-found: error
  qualify:
    needs: [build, replay]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - uses: actions/download-artifact@v8
        with:
          pattern: petclinic-graph-fit-*
          path: workflow-input/reports
      - uses: actions/download-artifact@v8
        with:
          pattern: petclinic-graph-replay-*
          path: workflow-input/reports
      - run: python scripts/collect_petclinic_graph_observation.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: petclinic-graph-qualification-${{ github.run_id }}
          path: workflow-results/qualification
          retention-days: 90
          if-no-files-found: error
