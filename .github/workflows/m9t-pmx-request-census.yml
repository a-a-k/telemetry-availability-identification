name: M9T learner-only PMX request correspondence census
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - name: Install pinned environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Verify preserved inputs and inspect only the four learner samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p workflow-results/m9t-request-census
          /usr/bin/time -v -o workflow-results/m9t-request-census/resource-usage.txt \
            python -m telemetry_availability.pmx_request_census
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: m9t-pmx-request-census-${{ github.run_id }}
          path: workflow-results/m9t-request-census
          if-no-files-found: error
          retention-days: 90
