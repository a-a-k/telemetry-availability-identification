name: M9V retained request representation audit
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - name: Install pinned environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Verify retained inputs and diagnose exact trace and loop encodings
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m telemetry_availability.pmx_retained_request_audit
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: m9v-retained-request-audit-${{ github.run_id }}
          path: workflow-results/m9v-retained
          if-no-files-found: error
          retention-days: 90
