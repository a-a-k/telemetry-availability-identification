name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate experiment contract
        run: python -m telemetry_availability validate-config --config configs/rq1_synthetic.yaml

      - name: Validate transfer experiment contract
        run: python -m telemetry_availability validate-transfer-config --config configs/m3_transfer.yaml

      - name: Validate uncertainty experiment contract
        run: python -m telemetry_availability validate-uncertainty-config --config configs/m4_uncertainty.yaml

      - name: Validate stress experiment contract
        run: python -m telemetry_availability validate-stress-config --config configs/m5_stress.yaml

      - name: Validate live-ingestion harness contract
        run: python -m telemetry_availability validate-live-harness --config configs/m6_live_harness.yaml

      - name: Validate remote runtime-pilot contract
        run: python -m telemetry_availability validate-runtime-pilot --config configs/m7_runtime_pilot.yaml

      - name: Validate fault-control and trace-linkage diagnostic contract
        run: python -m telemetry_availability validate-live-fault-diagnostic --config configs/m7a_fault_acquisition.yaml

      - name: Validate replicated-placement pilot contract
        run: python -m telemetry_availability validate-placement-pilot --config configs/m7b_placement_pilot.yaml

      - name: Validate stochastic freeze-pilot contract
        run: python -m telemetry_availability validate-stochastic-freeze-pilot --config configs/m7c_stochastic_freeze_pilot.yaml

      - name: Validate learner/evaluator evidence-boundary contract
        run: python -m telemetry_availability validate-evidence-boundary --config configs/m7d_evidence_boundary.yaml

      - name: Validate frozen main live-study contract
        run: python -m telemetry_availability validate-frozen-live-validation --config configs/m7_frozen_live.yaml

      - name: Validate main learner/evaluator boundary contract
        run: python -m telemetry_availability validate-evidence-boundary --config configs/m7_evidence_boundary.yaml

      - name: Validate no-fit M7 preflight evidence boundary
        run: python -m telemetry_availability validate-evidence-boundary --config configs/m7_preflight_evidence_boundary.yaml

      - name: Validate post-stopping macro-resource contract
        run: python -m telemetry_availability validate-macro-live-budget --config configs/m7c_macro_precision_recovery.yaml

      - name: Validate Palladio bootstrap contract
        run: python -m telemetry_availability validate-palladio-bootstrap --config configs/m9a_palladio_bootstrap.json

      - name: Validate Palladio semantic-control contract
        run: python -m telemetry_availability validate-palladio-controls --config configs/m9b_palladio_semantic_controls.json

      - name: Validate Palladio application-mapping contract
        run: python -m telemetry_availability validate-palladio-application-mapping --config configs/m9c_palladio_application_mapping.json

      - name: Ingest both live-contract fixtures
        if: ${{ matrix.python-version == '3.13' }}
        run: |
          python -m telemetry_availability ingest-live-bundle --config configs/m6_live_harness.yaml --benchmark deathstarbench_social_network --out workflow-results/live-smoke/deathstarbench
          python -m telemetry_availability ingest-live-bundle --config configs/m6_live_harness.yaml --benchmark opentelemetry_demo --out workflow-results/live-smoke/otel-demo

      - name: Run bounded smoke experiment
        if: ${{ matrix.python-version == '3.13' }}
        run: >-
          python -m telemetry_availability run
          --config configs/rq1_synthetic.yaml
          --out workflow-results/smoke
          --family same_domain_replicas
          --mode full
          --mode no_joint_health
          --repetitions 3
          --sample-sizes 100

      - name: Run bounded exact-likelihood smoke
        if: ${{ matrix.python-version == '3.13' }}
        run: >-
          python -m telemetry_availability run-likelihood-reference
          --config configs/rq1_synthetic.yaml
          --out workflow-results/likelihood-smoke
          --family same_domain_replicas
          --mode full
          --mode no_joint_health
          --repetitions 1
          --sample-sizes 100

      - name: Run bounded reduction smoke
        if: ${{ matrix.python-version == '3.13' }}
        run: >-
          python -m telemetry_availability run-reduction-experiment
          --config configs/rq1_synthetic.yaml
          --out workflow-results/reduction-smoke
          --family mandatory_fanout
          --mode full
          --mode trace_only
          --repetitions 1
          --sample-sizes 100

      - name: Run bounded transfer smoke
        if: ${{ matrix.python-version == '3.13' }}
        run: >-
          python -m telemetry_availability run-transfer-experiment
          --config configs/m3_transfer.yaml
          --out workflow-results/transfer-smoke
          --scenario medium_common_cause
          --mode full
          --mode trace_only
          --repetitions 1
          --sample-sizes 100
          --validation-episodes 100

      - name: Run bounded uncertainty smoke
        if: ${{ matrix.python-version == '3.13' }}
        run: >-
          python -m telemetry_availability run-uncertainty-experiment
          --config configs/m4_uncertainty.yaml
          --out workflow-results/uncertainty-smoke
          --scenario medium_common_cause
          --mode full
          --mode trace_only
          --repetitions 1
          --sample-sizes 100

      - name: Run bounded stress smoke
        if: ${{ matrix.python-version == '3.13' }}
        run: >-
          python -m telemetry_availability run-stress-experiment
          --config configs/m5_stress.yaml
          --out workflow-results/stress-smoke
          --series exporter_loss
          --series temporal_bursts
          --series wrong_domain_map
          --series rare_branch
          --series readiness_lag
          --repetitions 1
          --sample-sizes 100
          --bootstrap-replicates 9

      - name: Upload smoke evidence
        if: ${{ matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ github.run_id }}
          path: workflow-results/smoke
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact-likelihood smoke evidence
        if: ${{ matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@v7
        with:
          name: likelihood-smoke-${{ github.run_id }}
          path: workflow-results/likelihood-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Upload reduction smoke evidence
        if: ${{ matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@v7
        with:
          name: reduction-smoke-${{ github.run_id }}
          path: workflow-results/reduction-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Upload transfer smoke evidence
        if: ${{ matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@v7
        with:
          name: transfer-smoke-${{ github.run_id }}
          path: workflow-results/transfer-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Upload uncertainty smoke evidence
        if: ${{ matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@v7
        with:
          name: uncertainty-smoke-${{ github.run_id }}
          path: workflow-results/uncertainty-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Upload stress smoke evidence
        if: ${{ matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@v7
        with:
          name: stress-smoke-${{ github.run_id }}
          path: workflow-results/stress-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Upload live-ingestion smoke evidence
        if: ${{ matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@v7
        with:
          name: live-smoke-${{ github.run_id }}
          path: workflow-results/live-smoke
          if-no-files-found: error
          retention-days: 14
