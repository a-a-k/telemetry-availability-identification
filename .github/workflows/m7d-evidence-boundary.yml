name: M7D Learner Evidence Boundary Qualification

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful full M7C workflow run containing all 64 pilot cells
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    name: Qualify native traces and learner/evaluator separation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out experiment repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Download immutable M7C cell evidence
        uses: actions/download-artifact@v8
        with:
          pattern: m7c-cell-*-${{ inputs.source_run_id }}
          path: workflow-results/m7d-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}

      - name: Build separated evidence and apply frozen qualification gates
        env:
          M7D_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: >-
          python -m telemetry_availability qualify-evidence-boundary
          --config configs/m7d_evidence_boundary.yaml
          --input-root workflow-results/m7d-input
          --out workflow-results/m7d-qualified

      - name: Upload normalized evidence and boundary audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: m7d-evidence-boundary-${{ github.run_id }}
          path: workflow-results/m7d-qualified
          if-no-files-found: error
          retention-days: 30
