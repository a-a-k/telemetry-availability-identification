name: V3 main saved-data transport recovery v1
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: v3-main-34465226083-transport-recovery-v1
  cancel-in-progress: false
jobs:
  pmx:
    name: Recover saved PMX models and freeze unchanged graph forecasts
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Check out study repository
      uses: actions/checkout@v7
    - name: Check out pinned Palladio reliability source
      uses: actions/checkout@v7
      with:
        repository: PalladioSimulator/Palladio-Analyzer-Reliability
        ref: a694e570afb705dc9e0470dc321e77b7219dcea4
        path: palladio-source
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.13.15
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Set up pinned Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Install dependencies and validate the frozen contract
      run: "python -m pip install --upgrade pip\npython -m pip install -r requirements.txt\npython -m pip install --no-deps\
        \ -e .\npython -m telemetry_availability.pmx_context_comparison validate\ntest \"$(git -C palladio-source rev-parse\
        \ HEAD)\" = \\\n  \"a694e570afb705dc9e0470dc321e77b7219dcea4\"\n"
    - name: Retrieve all 81 exact saved extraction artifacts and verify their census
      run: python scripts/recover_v3_main_transport_v1.py pmx-inputs --profile "${{ matrix.profile }}"
    - name: Record actual model count including extraction abstentions
      run: echo "PETCLINIC_PMX_MODEL_COUNT=$(jq -r .model_count workflow-input/petclinic-pmx-contract/solver-contract.json)"
        >> "$GITHUB_ENV"
    - name: Reconstruct and audit the accepted release-date target platform
      run: "petclinic_pmx_maven_repo=\"${RUNNER_TEMP}/petclinic-pmx-maven-repository\"\nevidence_dir=\"workflow-results/petclinic-pmx-solver/target-lock/repository\"\
        \nmkdir -p \"$petclinic_pmx_maven_repo\" \"$evidence_dir\"\ncoordinate=\"$(jq -r '.target_platform_lock.coordinate'\
        \ configs/m9a_palladio_bootstrap.json)\"\nmvn -B -ntp \"-Dmaven.repo.local=${petclinic_pmx_maven_repo}\" \\\n\
        \  dependency:get \"-Dartifact=${coordinate}\"\ntarget_file=\"${petclinic_pmx_maven_repo}/org/palladiosimulator/palladio-target-platforms/0.1.0/palladio-target-platforms-0.1.0-palladio-2023-03.target\"\
        \nrepository_url=\"$(jq -r '.target_platform_lock.pinned_repository_url' configs/m9a_palladio_bootstrap.json)\"\
        \nwhile IFS= read -r relative_path; do\n  mkdir -p \"${evidence_dir}/$(dirname \"$relative_path\")\"\n  curl\
        \ --fail --location --retry 5 --retry-all-errors \\\n    --output \"${evidence_dir}/${relative_path}\" \\\n \
        \   \"${repository_url}${relative_path}\"\ndone < <(jq -r '.target_platform_lock.repository_evidence[].relative_path'\
        \ configs/m9a_palladio_bootstrap.json)\npython -m telemetry_availability lock-palladio-target-platform \\\n \
        \ --config configs/m9a_palladio_bootstrap.json \\\n  --target-file \"$target_file\" \\\n  --repository-evidence-dir\
        \ \"$evidence_dir\" \\\n  --out workflow-results/petclinic-pmx-solver/target-lock/manifest.json\necho \"PETCLINIC_PMX_MAVEN_REPO=${petclinic_pmx_maven_repo}\"\
        \ >> \"$GITHUB_ENV\"\ngit -C palladio-source diff --exit-code\n"
    - name: Reconfirm the accepted analyzer capability boundary
      run: python -m telemetry_availability audit-palladio-capability-source --config configs/m9b_palladio_semantic_controls.json
        --analyzer-checkout palladio-source --out workflow-results/petclinic-pmx-solver/capability-manifest.json
    - name: Overlay versioned generic harness with per-case StackOverflowError records
      run: "test_bundle=\"palladio-source/tests/org.palladiosimulator.reliability.tests\"\ncp palladio/harness/META-INF/MANIFEST.MF\
        \ \"$test_bundle/META-INF/MANIFEST.MF\"\ncp palladio/harness/src/org/palladiosimulator/reliability/tests/PmxContextBridgeTest.java\
        \ \\\n  \"$test_bundle/src/org/palladiosimulator/reliability/tests/PmxContextBridgeTest.java\"\ngit -C palladio-source\
        \ status --short > workflow-results/petclinic-pmx-solver/harness-overlay.txt\ntest \"$(git -C palladio-source\
        \ diff --name-only)\" = \\\n  \"tests/org.palladiosimulator.reliability.tests/META-INF/MANIFEST.MF\"\ntest \"\
        $(git -C palladio-source ls-files --others --exclude-standard)\" = \\\n  \"tests/org.palladiosimulator.reliability.tests/src/org/palladiosimulator/reliability/tests/PmxContextBridgeTest.java\"\
        \n"
    - name: Build the pinned analyzer without running the aligned experiment
      run: "mkdir -p workflow-results/petclinic-pmx-solver/runtime\njava -version > workflow-results/petclinic-pmx-solver/runtime/java-version.txt\
        \ 2>&1\nmvn -version > workflow-results/petclinic-pmx-solver/runtime/maven-version.txt 2>&1\nlscpu > workflow-results/petclinic-pmx-solver/runtime/runner-cpu.txt\n\
        free -b > workflow-results/petclinic-pmx-solver/runtime/runner-memory.txt\nset -o pipefail\n/usr/bin/time -v\
        \ -o workflow-results/petclinic-pmx-solver/runtime/build-resource-usage.txt \\\n  xvfb-run -a mvn -B -ntp \"\
        -Dmaven.repo.local=${PETCLINIC_PMX_MAVEN_REPO}\" \\\n    -DskipTests=true -f palladio-source/pom.xml clean verify\
        \ \\\n  2>&1 | tee workflow-results/petclinic-pmx-solver/runtime/build.log\ntest \"${PIPESTATUS[0]}\" -eq 0\n"
    - name: Solve every supported model twice
      env:
        TAID_PALLADIO_ALIGNED_ROOT: ${{ github.workspace }}/workflow-input/petclinic-pmx-contract/models
        TAID_PALLADIO_RESULT: ${{ github.workspace }}/workflow-results/petclinic-pmx-solver/raw-result.json
        TAID_REPEAT_RUNS: '2'
        TAID_EXPECTED_MODEL_COUNT: ${{ env.PETCLINIC_PMX_MODEL_COUNT }}
        TAID_EXPECTED_CASE_COUNT: ${{ env.PETCLINIC_PMX_MODEL_COUNT }}
        TAID_PROBABILITY_TOLERANCE: 1e-12
      run: "set -o pipefail\n/usr/bin/time -v -o workflow-results/petclinic-pmx-solver/runtime/solve-resource-usage.txt\
        \ \\\n  xvfb-run -a mvn -B -ntp \"-Dmaven.repo.local=${PETCLINIC_PMX_MAVEN_REPO}\" \\\n    -f palladio-source/pom.xml\
        \ verify \\\n  2>&1 | tee workflow-results/petclinic-pmx-solver/runtime/solve.log\ntest \"${PIPESTATUS[0]}\"\
        \ -eq 0\n"
      if: ${{ env.PETCLINIC_PMX_MODEL_COUNT != '0' }}
    - name: Collect test reports
      if: ${{ always() }}
      run: "report_root=\"palladio-source/tests/org.palladiosimulator.reliability.tests/target/surefire-reports\"\nif\
        \ [[ -d \"$report_root\" ]]; then\n  cp -R \"$report_root\" workflow-results/petclinic-pmx-solver/surefire-reports\n\
        fi\n"
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: v3-main-recovery-pmx-solver-${{ matrix.profile }}-${{ github.run_id }}
        path: workflow-results/petclinic-pmx-solver
        retention-days: 90
        if-no-files-found: warn
    - name: Seal recovered PMX with the exact original eight graph-family forecasts
      run: python scripts/recover_v3_main_transport_v1.py pmx-freeze --profile "${{ matrix.profile }}"
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: v3-main-recovery-pmx-candidates-${{ matrix.profile }}-${{ github.run_id }}
        path: workflow-results/pmx-candidates
        retention-days: 90
        if-no-files-found: warn
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: v3-main-recovery-pmx-solver-contract-${{ matrix.profile }}-${{ github.run_id }}
        path: workflow-input/petclinic-pmx-contract
        retention-days: 90
        if-no-files-found: warn
    - uses: actions/upload-artifact@v7
      with:
        name: v3-main-recovery-frozen-${{ matrix.profile }}-${{ github.run_id }}
        path: workflow-results/recovery-frozen
        if-no-files-found: error
        retention-days: 90
    strategy:
      fail-fast: false
      matrix:
        profile:
        - deathstarbench_social_network
        - opentelemetry_demo
        - spring_petclinic_microservices
    env:
      GH_TOKEN: ${{ github.token }}
  rescore:
    needs:
    - pmx
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: 3.13.15
        cache: pip
    - name: Install frozen Python environment
      run: 'python -m pip install -r requirements.txt

        python -m pip install --no-deps -e .'
    - name: Execute the recorded recovery stage
      env:
        GH_TOKEN: ${{ github.token }}
      run: python scripts/recover_v3_main_transport_v1.py rescore --profile "${{ matrix.profile }}"
    - uses: actions/upload-artifact@v7
      with:
        name: v3-main-recovery-evaluation-${{ matrix.profile }}-${{ github.run_id }}
        path: workflow-results/recovery-evaluation
        if-no-files-found: error
        retention-days: 90
    strategy:
      fail-fast: false
      matrix:
        profile:
        - deathstarbench_social_network
        - opentelemetry_demo
        - spring_petclinic_microservices
  analysis:
    needs:
    - rescore
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: 3.13.15
        cache: pip
    - name: Install frozen Python environment
      run: 'python -m pip install -r requirements.txt

        python -m pip install --no-deps -e .'
    - name: Execute the recorded recovery stage
      env:
        GH_TOKEN: ${{ github.token }}
      run: python scripts/recover_v3_main_transport_v1.py summarize
    - uses: actions/upload-artifact@v7
      with:
        name: v3-main-recovery-analysis-${{ github.run_id }}
        path: workflow-results/recovery-analysis
        if-no-files-found: error
        retention-days: 90
