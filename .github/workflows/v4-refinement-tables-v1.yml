name: V4 complete refinement tables v1
on:
  workflow_run:
    workflows: [V4 confirmation aggregate repair v3, V4 independent observation missingness v3, V4 exact costs on independently checked models v3]
    types: [completed]
  workflow_dispatch:
    inputs:
      missingness_run:
        description: Exact first missingness execution to retain, including failures
        required: true
        type: string
      performance_run:
        description: Exact first native performance execution to retain, including failures
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.select.outputs.ready }}
      summary_run: ${{ steps.select.outputs.summary_run }}
      missingness_run: ${{ steps.select.outputs.missingness_run }}
      performance_run: ${{ steps.select.outputs.performance_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select the first terminal declared executions without choosing successful replacements
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_PAIR: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          MISSINGNESS_RUN: ${{ inputs.missingness_run }}
          PERFORMANCE_RUN: ${{ inputs.performance_run }}
        run: python scripts/select_v4_followups_v1.py
  tables:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SUMMARY_RUN: ${{ needs.resolve.outputs.summary_run }}
      MISSINGNESS_RUN: ${{ needs.resolve.outputs.missingness_run }}
      PERFORMANCE_RUN: ${{ needs.resolve.outputs.performance_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install the declared report environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Verify original scientific implementation and exact numeric input IDs
        run: |
          python scripts/verify_staged_research_lock.py configs/v3_comparison_execution_v3.json
          python -c "import os; assert all(os.environ[k].isdigit() and int(os.environ[k]) > 0 for k in ('SUMMARY_RUN','MISSINGNESS_RUN','PERFORMANCE_RUN'))"
      - name: Retain the complete independent cohort and verify all temporal barriers
        run: |
          python scripts/retain_v4_confirmation_v2.py
          python scripts/retain_v4_confirmation_summary_v3.py --run "$SUMMARY_RUN"
          python scripts/summarize_v4_confirmation_v2.py --summary-run "$SUMMARY_RUN"
      - name: Retain every fixed missingness and information-restoration setting
        run: python scripts/retain_v4_missingness_v2.py --run "$MISSINGNESS_RUN"
      - name: Retain every native configuration and render every timing and memory table
        run: |
          python scripts/retain_v4_confirmed_performance_v2.py --run "$PERFORMANCE_RUN"
          python scripts/summarize_v4_confirmed_performance_v2.py --input "docs/evidence/v4-confirmed-performance-v2-$PERFORMANCE_RUN" --out "docs/tables/v4-confirmed-performance-v2-$PERFORMANCE_RUN"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v4-complete-refinement-tables-${{ github.run_id }}
          path: |
            docs/evidence/v4-confirmation-v2-34703686592
            docs/evidence/v4-confirmation-summary-v3-${{ needs.resolve.outputs.summary_run }}
            docs/tables/v4-confirmation-v2-34703686592
            docs/evidence/v4-missingness-v2-${{ needs.resolve.outputs.missingness_run }}
            docs/tables/v4-missingness-v2-${{ needs.resolve.outputs.missingness_run }}
            docs/evidence/v4-confirmed-performance-v2-${{ needs.resolve.outputs.performance_run }}
            docs/tables/v4-confirmed-performance-v2-${{ needs.resolve.outputs.performance_run }}
          if-no-files-found: error
          retention-days: 90
