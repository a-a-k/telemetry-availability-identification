name: M9C Palladio Application Mapping

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: m9c-palladio-application-mapping-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence_contract:
    name: Audit source correspondence and generate application PCM models
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out study repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install and validate the frozen M9C contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m telemetry_availability validate-palladio-application-mapping \
            --config configs/m9c_palladio_application_mapping.json

      - name: Download the accepted M8B topology evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          contract_root="workflow-results/m9c-contract"
          mkdir -p "$contract_root/evidence/m8b"
          artifact_id="$(jq -r '.accepted_m8b_evidence.artifact_id' configs/m9c_palladio_application_mapping.json)"
          run_id="$(jq -r '.accepted_m8b_evidence.run_id' configs/m9c_palladio_application_mapping.json)"
          artifact_name="$(jq -r '.accepted_m8b_evidence.artifact_name' configs/m9c_palladio_application_mapping.json)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
            > "$contract_root/evidence/artifact-metadata.json"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" --dir "$contract_root/evidence/m8b"

      - name: Download exact application source files at their pinned commits
        run: |
          upstream_root="workflow-results/m9c-contract/evidence/upstream"
          jq -c '.applications[] as $app | $app.source_evidence[] | {application: $app.id, repository: $app.upstream.repository, commit: $app.upstream.commit, path: .path}' \
            configs/m9c_palladio_application_mapping.json |
          while IFS= read -r record; do
            application="$(jq -r '.application' <<< "$record")"
            repository="$(jq -r '.repository' <<< "$record")"
            commit="$(jq -r '.commit' <<< "$record")"
            source_path="$(jq -r '.path' <<< "$record")"
            slug="${repository#https://github.com/}"
            slug="${slug%.git}"
            destination="${upstream_root}/${application}/${source_path}"
            mkdir -p "$(dirname "$destination")"
            curl --globoff --fail --location --retry 5 --retry-all-errors \
              --output "$destination" \
              "https://raw.githubusercontent.com/${slug}/${commit}/${source_path}"
          done

      - name: Audit evidence and generate the mandatory correspondence table
        run: |
          mkdir -p workflow-results/m9c-contract/evidence
          set -o pipefail
          /usr/bin/time -v -o workflow-results/m9c-contract/evidence/resource-usage.txt \
            python -m telemetry_availability audit-palladio-application-evidence \
              --config configs/m9c_palladio_application_mapping.json \
              --m8b-input-root workflow-results/m9c-contract/evidence/m8b \
              --artifact-metadata workflow-results/m9c-contract/evidence/artifact-metadata.json \
              --upstream-root workflow-results/m9c-contract/evidence/upstream \
              --repository-root . \
              --out workflow-results/m9c-contract/evidence \
            2>&1 | tee workflow-results/m9c-contract/evidence/evidence-audit.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Generate and independently audit all application models
        run: |
          set -o pipefail
          /usr/bin/time -v -o workflow-results/m9c-contract/model-resource-usage.txt \
            bash -c '
              python -m telemetry_availability generate-palladio-application-models \
                --config configs/m9c_palladio_application_mapping.json \
                --out workflow-results/m9c-contract/models \
                --manifest workflow-results/m9c-contract/generation-manifest.json &&
              python -m telemetry_availability audit-palladio-application-models \
                --config configs/m9c_palladio_application_mapping.json \
                --models workflow-results/m9c-contract/models \
                --repository-root . \
                --out workflow-results/m9c-contract/model-contract-manifest.json
            ' 2>&1 | tee workflow-results/m9c-contract/model-contract.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Retain exact mapping evidence and audited PCM inputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: m9c-palladio-contract-${{ github.run_id }}
          path: workflow-results/m9c-contract
          if-no-files-found: error
          retention-days: 90

  application_models:
    name: Execute source-grounded operation models through Palladio 5.2.2
    needs: evidence_contract
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out study repository
        uses: actions/checkout@v7

      - name: Check out pinned Palladio reliability source
        uses: actions/checkout@v7
        with:
          repository: PalladioSimulator/Palladio-Analyzer-Reliability
          ref: a694e570afb705dc9e0470dc321e77b7219dcea4
          path: palladio-source

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up pinned Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install and validate the frozen M9C contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m telemetry_availability validate-palladio-application-mapping \
            --config configs/m9c_palladio_application_mapping.json
          test "$(git -C palladio-source rev-parse HEAD)" = \
            "a694e570afb705dc9e0470dc321e77b7219dcea4"

      - name: Download the exact audited correspondence and PCM models
        uses: actions/download-artifact@v8
        with:
          name: m9c-palladio-contract-${{ github.run_id }}
          path: workflow-input/m9c-contract

      - name: Reconstruct and audit the release-date target platform
        run: |
          m9c_maven_repo="${RUNNER_TEMP}/m9c-maven-repository"
          evidence_dir="workflow-results/m9c-application-models/target-lock/repository"
          mkdir -p "$m9c_maven_repo" "$evidence_dir"
          coordinate="$(jq -r '.target_platform_lock.coordinate' configs/m9a_palladio_bootstrap.json)"
          mvn -B -ntp "-Dmaven.repo.local=${m9c_maven_repo}" \
            dependency:get "-Dartifact=${coordinate}"
          target_file="${m9c_maven_repo}/org/palladiosimulator/palladio-target-platforms/0.1.0/palladio-target-platforms-0.1.0-palladio-2023-03.target"
          repository_url="$(jq -r '.target_platform_lock.pinned_repository_url' configs/m9a_palladio_bootstrap.json)"
          while IFS= read -r relative_path; do
            mkdir -p "${evidence_dir}/$(dirname "$relative_path")"
            curl --fail --location --retry 5 --retry-all-errors \
              --output "${evidence_dir}/${relative_path}" \
              "${repository_url}${relative_path}"
          done < <(jq -r '.target_platform_lock.repository_evidence[].relative_path' configs/m9a_palladio_bootstrap.json)
          python -m telemetry_availability lock-palladio-target-platform \
            --config configs/m9a_palladio_bootstrap.json \
            --target-file "$target_file" \
            --repository-evidence-dir "$evidence_dir" \
            --out workflow-results/m9c-application-models/target-lock/manifest.json
          echo "M9C_MAVEN_REPO=${m9c_maven_repo}" >> "$GITHUB_ENV"
          git -C palladio-source diff --exit-code

      - name: Reconfirm the analyzer capability boundary
        run: >-
          python -m telemetry_availability audit-palladio-capability-source
          --config configs/m9b_palladio_semantic_controls.json
          --analyzer-checkout palladio-source
          --out workflow-results/m9c-application-models/capability-manifest.json

      - name: Overlay the already audited generic solver harness only
        run: |
          test_bundle="palladio-source/tests/org.palladiosimulator.reliability.tests"
          cp palladio/harness/META-INF/MANIFEST.MF "$test_bundle/META-INF/MANIFEST.MF"
          cp palladio/harness/src/org/palladiosimulator/reliability/tests/SemanticControlsTest.java \
            "$test_bundle/src/org/palladiosimulator/reliability/tests/SemanticControlsTest.java"
          git -C palladio-source status --short > \
            workflow-results/m9c-application-models/harness-overlay.txt
          test "$(git -C palladio-source diff --name-only)" = \
            "tests/org.palladiosimulator.reliability.tests/META-INF/MANIFEST.MF"
          test "$(git -C palladio-source ls-files --others --exclude-standard)" = \
            "tests/org.palladiosimulator.reliability.tests/src/org/palladiosimulator/reliability/tests/SemanticControlsTest.java"

      - name: Run all four operation-placement models twice
        env:
          TAID_PALLADIO_CONTROLS_ROOT: ${{ github.workspace }}/workflow-input/m9c-contract/models
          TAID_PALLADIO_RESULT: ${{ github.workspace }}/workflow-results/m9c-application-models/raw-result.json
        run: |
          export TAID_REPEAT_RUNS="$(jq -r '.runtime.repeat_runs' configs/m9c_palladio_application_mapping.json)"
          export TAID_PROBABILITY_TOLERANCE="$(jq -r '.runtime.probability_tolerance' configs/m9c_palladio_application_mapping.json)"
          export TAID_EXPECTED_MODEL_COUNT="$(jq '.models | length' configs/m9c_palladio_application_mapping.json)"
          export TAID_EXPECTED_CASE_COUNT="$(jq '.models | length' configs/m9c_palladio_application_mapping.json)"
          java -version > workflow-results/m9c-application-models/java-version.txt 2>&1
          mvn -version > workflow-results/m9c-application-models/maven-version.txt 2>&1
          set -o pipefail
          /usr/bin/time -v -o workflow-results/m9c-application-models/resource-usage.txt \
            xvfb-run -a mvn -B -ntp "-Dmaven.repo.local=${M9C_MAVEN_REPO}" \
            -f palladio-source/pom.xml clean verify \
            2>&1 | tee workflow-results/m9c-application-models/build-and-test.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Collect test reports
        if: ${{ always() }}
        run: |
          report_root="palladio-source/tests/org.palladiosimulator.reliability.tests/target/surefire-reports"
          if [[ -d "$report_root" ]]; then
            cp -R "$report_root" workflow-results/m9c-application-models/surefire-reports
          fi

      - name: Retain raw application-model solver evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: m9c-palladio-application-models-${{ github.run_id }}
          path: workflow-results/m9c-application-models
          if-no-files-found: error
          retention-days: 90

  acceptance_audit:
    name: Audit source-grounded structural witnesses and repetitions
    needs: [evidence_contract, application_models]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out study repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install and validate the frozen M9C contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m telemetry_availability validate-palladio-application-mapping \
            --config configs/m9c_palladio_application_mapping.json

      - name: Download exact contract and solver artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: m9c-palladio-*-${{ github.run_id }}
          path: workflow-input

      - name: Audit all solver results against the predeclared witnesses
        run: |
          mkdir -p workflow-results/m9c-acceptance
          set -o pipefail
          /usr/bin/time -v -o workflow-results/m9c-acceptance/resource-usage.txt \
            python -m telemetry_availability audit-palladio-application-results \
              --config configs/m9c_palladio_application_mapping.json \
              --evidence-manifest workflow-input/m9c-palladio-contract-${{ github.run_id }}/evidence/evidence-manifest.json \
              --model-manifest workflow-input/m9c-palladio-contract-${{ github.run_id }}/model-contract-manifest.json \
              --result workflow-input/m9c-palladio-application-models-${{ github.run_id }}/raw-result.json \
              --models workflow-input/m9c-palladio-contract-${{ github.run_id }}/models \
              --out workflow-results/m9c-acceptance/acceptance-manifest.json \
            2>&1 | tee workflow-results/m9c-acceptance/acceptance.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Retain accepted M9C evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: m9c-palladio-acceptance-${{ github.run_id }}
          path: workflow-results/m9c-acceptance
          if-no-files-found: error
          retention-days: 90
