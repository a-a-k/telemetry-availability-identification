name: V3 corrected exact comparison v2 durable archive
on:
  workflow_run:
    workflows: [V3 corrected exact comparison v2]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed corrected comparison run
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: exact-comparison-v2-archive-${{ github.event.workflow_run.id || inputs.source_run }}
  cancel-in-progress: false
jobs:
  archive:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Preserve all eight original evidence ZIPs in an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.source_run }}
        run: python scripts/archive_v3_exact_comparison_v2.py
      - uses: actions/upload-artifact@v7
        with:
          name: v3-exact-comparison-v2-archive-compact-${{ github.run_id }}
          path: |
            workflow-results/exact-backends-archive/compact.json
            workflow-results/exact-backends-archive/manifest.json
            workflow-results/exact-backends-archive/source-artifacts.json
          if-no-files-found: error
          retention-days: 90
