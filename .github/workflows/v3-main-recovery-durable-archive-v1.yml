name: V3 recovered main durable unpublished evidence archive

on:
  workflow_run:
    workflows: [V3 main saved-data transport recovery v1]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: v3-main-recovery-34517752889-durable-archive-v1
  cancel-in-progress: false

jobs:
  archive:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.id == 34517752889 && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Preserve the exact completed recovery solver and evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/archive_v3_main_recovery_evidence_v1.py
      - name: Retain only compact archival provenance
        uses: actions/upload-artifact@v7
        with:
          name: v3-main-recovery-archive-compact-${{ github.run_id }}
          path: |
            workflow-results/recovery-archive/compact.json
            workflow-results/recovery-archive/manifest.json
            workflow-results/recovery-archive/source-artifacts.json
          if-no-files-found: error
          retention-days: 90
