name: V3 corrected exact comparison v2
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        profile: [deathstarbench_social_network, opentelemetry_demo, spring_petclinic_microservices, synthetic]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: 3.11.16
      - name: Verify frozen scientific sources
        run: python scripts/verify_staged_research_lock.py configs/v3_comparison_execution_v3.json
      - name: Install fixed native backends
        run: |
          python -m pip install -r requirements-exact-backends-v1.txt
          python -m pip install --no-deps -e .
      - name: Native semantic controls in a separate exited process
        run: python scripts/benchmark_v3_exact_comparison_v2.py controls
      - name: Measure complete fixed panel then qualify in a separate pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/benchmark_v3_exact_comparison_v2.py run --profile ${{ matrix.profile }} --out workflow-results/comparison
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: v3-exact-comparison-v2-compact-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/comparison/compact
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: v3-exact-comparison-v2-full-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/comparison
          retention-days: 90
          if-no-files-found: error
