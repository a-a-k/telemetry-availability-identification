name: V3 G0 source adaptation qualification v1
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [deathstarbench_social_network, opentelemetry_demo, spring_petclinic_microservices]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p workflow-results/preparation
          /usr/bin/time -v -o workflow-results/preparation/resource-usage.txt python -m telemetry_availability.v3_g0_qualification_v1 prepare --profile '${{ matrix.profile }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-g0-source-model-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/source-model
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-g0-preparation-compact-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/preparation
          retention-days: 90
          if-no-files-found: error
  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [deathstarbench_social_network, opentelemetry_demo, spring_petclinic_microservices]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v8
        with:
          name: v3-g0-source-model-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-input/source-model
      - run: |
          mkdir -p workflow-results/fit
          /usr/bin/time -v -o workflow-results/fit/resource-usage.txt python -m telemetry_availability.v3_g0_qualification_v1 build --profile '${{ matrix.profile }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-g0-fit-compact-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/fit
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-g0-model-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/models
          retention-days: 90
          if-no-files-found: error
  replay:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [deathstarbench_social_network, opentelemetry_demo, spring_petclinic_microservices]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v8
        with:
          name: v3-g0-model-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-input/g0-model
      - run: |
          mkdir -p workflow-results/replay
          /usr/bin/time -v -o workflow-results/replay/resource-usage.txt python -m telemetry_availability.v3_g0_qualification_v1 replay --profile '${{ matrix.profile }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-g0-replay-compact-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/replay
          retention-days: 90
          if-no-files-found: error
