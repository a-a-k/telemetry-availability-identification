name: Petclinic calibration-only original model interface qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        placement: [colocated, split]
        law: [N, NC, ND, NCD]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - name: Install pinned original stochastic model environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Restore and audit exactly one learner role
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_petclinic_technical_learner.py --placement '${{ matrix.placement }}' --law '${{ matrix.law }}'
      - name: Fit original finite-state likelihood with enforced read boundary
        if: ${{ steps.source.outputs.usable == 'true' }}
        run: |
          mkdir -p workflow-results/fit
          /usr/bin/time -v -o workflow-results/fit-resource-usage.txt python -m telemetry_availability.isolated_stochastic_fit --learner workflow-input/learner --out workflow-results/fit
      - name: Inventory observed calibration database constructs for PMX
        if: ${{ always() && steps.source.outputs.usable == 'true' }}
        run: python scripts/summarize_petclinic_native_constructs.py
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: petclinic-isolated-model-${{ matrix.placement }}-${{ matrix.law }}-${{ github.run_id }}
          path: workflow-results
          retention-days: 90
          if-no-files-found: error
