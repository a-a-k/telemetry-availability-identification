name: M9V retained independent PMX application recovery
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: 3.13.15
    - name: Install and verify retained recovery contract
      run: |
        python -m pip install -r requirements.txt
        python -m pip install --no-deps -e .
        python -m telemetry_availability.pmx_application_recovery validate
    - name: Verify retained M9V inputs and M9S controls without re-extraction or refitting
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p workflow-results/m9v-recovery-contract
        /usr/bin/time -v -o workflow-results/m9v-recovery-contract/preparation-resource-usage.txt python -m telemetry_availability.pmx_application_recovery prepare --inputs workflow-input/m9v-recovery --out workflow-results/m9v-recovery-contract
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: m9v-recovery-contract-${{ github.run_id }}
        path: workflow-results/m9v-recovery-contract
        if-no-files-found: error
        retention-days: 90
  palladio_solver:
    name: Solve retained application models and mixed-PMF controls
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Check out study repository
      uses: actions/checkout@v7
    - name: Check out pinned Palladio reliability source
      uses: actions/checkout@v7
      with:
        repository: PalladioSimulator/Palladio-Analyzer-Reliability
        ref: a694e570afb705dc9e0470dc321e77b7219dcea4
        path: palladio-source
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.13.15
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Set up pinned Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Install dependencies and validate the frozen contract
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install --no-deps -e .
        python -m telemetry_availability.pmx_application_recovery validate
        test "$(git -C palladio-source rev-parse HEAD)" = \
          "a694e570afb705dc9e0470dc321e77b7219dcea4"
    - name: Download the retained artificial PCM contract
      uses: actions/download-artifact@v8
      with:
        name: m9v-recovery-contract-${{ github.run_id }}
        path: workflow-input/m9v-recovery-contract
    - name: Record actual model count including extraction abstentions
      run: echo "M9VR_MODEL_COUNT=$(jq -r .model_count workflow-input/m9v-recovery-contract/solver-contract.json)"
        >> "$GITHUB_ENV"
    - name: Reconstruct and audit the accepted release-date target platform
      run: |
        m9vr_maven_repo="${RUNNER_TEMP}/m9v-recovery-maven-repository"
        evidence_dir="workflow-results/m9v-recovery-solver/target-lock/repository"
        mkdir -p "$m9vr_maven_repo" "$evidence_dir"
        coordinate="$(jq -r '.target_platform_lock.coordinate' configs/m9a_palladio_bootstrap.json)"
        mvn -B -ntp "-Dmaven.repo.local=${m9vr_maven_repo}" \
          dependency:get "-Dartifact=${coordinate}"
        target_file="${m9vr_maven_repo}/org/palladiosimulator/palladio-target-platforms/0.1.0/palladio-target-platforms-0.1.0-palladio-2023-03.target"
        repository_url="$(jq -r '.target_platform_lock.pinned_repository_url' configs/m9a_palladio_bootstrap.json)"
        while IFS= read -r relative_path; do
          mkdir -p "${evidence_dir}/$(dirname "$relative_path")"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "${evidence_dir}/${relative_path}" \
            "${repository_url}${relative_path}"
        done < <(jq -r '.target_platform_lock.repository_evidence[].relative_path' configs/m9a_palladio_bootstrap.json)
        python -m telemetry_availability lock-palladio-target-platform \
          --config configs/m9a_palladio_bootstrap.json \
          --target-file "$target_file" \
          --repository-evidence-dir "$evidence_dir" \
          --out workflow-results/m9v-recovery-solver/target-lock/manifest.json
        echo "M9VR_MAVEN_REPO=${m9vr_maven_repo}" >> "$GITHUB_ENV"
        git -C palladio-source diff --exit-code
    - name: Reconfirm the accepted analyzer capability boundary
      run: python -m telemetry_availability audit-palladio-capability-source --config
        configs/m9b_palladio_semantic_controls.json --analyzer-checkout palladio-source
        --out workflow-results/m9v-recovery-solver/capability-manifest.json
    - name: Overlay only the audited generic M9U harness
      run: |
        test_bundle="palladio-source/tests/org.palladiosimulator.reliability.tests"
        cp palladio/harness/META-INF/MANIFEST.MF "$test_bundle/META-INF/MANIFEST.MF"
        cp palladio/harness/src/org/palladiosimulator/reliability/tests/PmxPmfBridgeTest.java \
          "$test_bundle/src/org/palladiosimulator/reliability/tests/PmxPmfBridgeTest.java"
        git -C palladio-source status --short > workflow-results/m9v-recovery-solver/harness-overlay.txt
        test "$(git -C palladio-source diff --name-only)" = \
          "tests/org.palladiosimulator.reliability.tests/META-INF/MANIFEST.MF"
        test "$(git -C palladio-source ls-files --others --exclude-standard)" = \
          "tests/org.palladiosimulator.reliability.tests/src/org/palladiosimulator/reliability/tests/PmxPmfBridgeTest.java"
    - name: Build the pinned analyzer without running the aligned experiment
      run: |
        mkdir -p workflow-results/m9v-recovery-solver/runtime
        java -version > workflow-results/m9v-recovery-solver/runtime/java-version.txt 2>&1
        mvn -version > workflow-results/m9v-recovery-solver/runtime/maven-version.txt 2>&1
        lscpu > workflow-results/m9v-recovery-solver/runtime/runner-cpu.txt
        free -b > workflow-results/m9v-recovery-solver/runtime/runner-memory.txt
        set -o pipefail
        /usr/bin/time -v -o workflow-results/m9v-recovery-solver/runtime/build-resource-usage.txt \
          xvfb-run -a mvn -B -ntp "-Dmaven.repo.local=${M9VR_MAVEN_REPO}" \
            -DskipTests=true -f palladio-source/pom.xml clean verify \
          2>&1 | tee workflow-results/m9v-recovery-solver/runtime/build.log
        test "${PIPESTATUS[0]}" -eq 0
    - name: Solve every supported model twice
      env:
        TAID_PALLADIO_ALIGNED_ROOT: ${{ github.workspace }}/workflow-input/m9v-recovery-contract/models
        TAID_PALLADIO_RESULT: ${{ github.workspace }}/workflow-results/m9v-recovery-solver/raw-result.json
        TAID_REPEAT_RUNS: '2'
        TAID_EXPECTED_MODEL_COUNT: ${{ env.M9VR_MODEL_COUNT }}
        TAID_EXPECTED_CASE_COUNT: ${{ env.M9VR_MODEL_COUNT }}
        TAID_PROBABILITY_TOLERANCE: 1e-12
      run: |
        set -o pipefail
        /usr/bin/time -v -o workflow-results/m9v-recovery-solver/runtime/solve-resource-usage.txt \
          xvfb-run -a mvn -B -ntp "-Dmaven.repo.local=${M9VR_MAVEN_REPO}" \
            -f palladio-source/pom.xml verify \
          2>&1 | tee workflow-results/m9v-recovery-solver/runtime/solve.log
        test "${PIPESTATUS[0]}" -eq 0
      if: ${{ env.M9VR_MODEL_COUNT != '0' }}
    - name: Collect test reports
      if: ${{ always() }}
      run: |
        report_root="palladio-source/tests/org.palladiosimulator.reliability.tests/target/surefire-reports"
        if [[ -d "$report_root" ]]; then
          cp -R "$report_root" workflow-results/m9v-recovery-solver/surefire-reports
        fi
    - name: Retain raw untuned solver output and timing
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: m9v-recovery-solver-${{ github.run_id }}
        path: workflow-results/m9v-recovery-solver
        if-no-files-found: error
        retention-days: 90
  freeze:
    needs:
    - prepare
    - palladio_solver
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: 3.13.15
    - name: Install and verify retained recovery contract
      run: |
        python -m pip install -r requirements.txt
        python -m pip install --no-deps -e .
        python -m telemetry_availability.pmx_application_recovery validate
    - uses: actions/download-artifact@v8
      with:
        name: m9v-recovery-contract-${{ github.run_id }}
        path: workflow-input/contract
    - uses: actions/download-artifact@v8
      with:
        name: m9v-recovery-solver-${{ github.run_id }}
        path: workflow-input/solver
    - name: Require four mixed-PMF oracle passes and seal application forecasts
      run: python -m telemetry_availability.pmx_application_recovery freeze --contract
        workflow-input/contract --solver workflow-input/solver --out workflow-results/candidates
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: m9v-recovery-candidates-${{ github.run_id }}
        path: workflow-results/candidates
        if-no-files-found: error
        retention-days: 90
  evaluate:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: 3.13.15
    - name: Install and verify retained recovery contract
      run: |
        python -m pip install -r requirements.txt
        python -m pip install --no-deps -e .
        python -m telemetry_availability.pmx_application_recovery validate
    - uses: actions/download-artifact@v8
      with:
        name: m9v-recovery-contract-${{ github.run_id }}
        path: workflow-input/contract
    - uses: actions/download-artifact@v8
      with:
        name: m9v-recovery-candidates-${{ github.run_id }}
        path: workflow-input/candidates
    - name: Evaluate retained independent forecasts with unchanged baseline predictions
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -m telemetry_availability.pmx_application_recovery evaluate --contract
        workflow-input/contract --candidates workflow-input/candidates --source-inputs
        workflow-input/evaluation-source --out workflow-results/evaluation
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: m9v-recovery-evaluation-${{ github.run_id }}
        path: workflow-results/evaluation
        if-no-files-found: error
        retention-days: 90
