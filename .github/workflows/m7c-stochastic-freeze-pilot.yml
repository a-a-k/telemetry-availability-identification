name: M7C Stochastic Schedule and Budget Freeze Pilot

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Run the full frozen pilot matrix or the two-cell controller smoke
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke

permissions:
  contents: read
  packages: read

concurrency:
  group: m7c-stochastic-freeze-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pilot:
    name: ${{ matrix.application.profile }} / ${{ matrix.placement }} / ${{ matrix.law }} / r${{ matrix.repetition }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        application:
          - profile: deathstarbench_social_network
            repository: delimitrou/DeathStarBench
            commit: 6ecb09706140f8730b5385c08f1386c654c3c526
            compose_file: socialNetwork/docker-compose.yml
          - profile: opentelemetry_demo
            repository: open-telemetry/opentelemetry-demo
            commit: 8c47d47c9ac27710d2b2a153bcd53e483bffe66d
            compose_file: compose.yaml
        placement: ${{ fromJSON(inputs.scope == 'smoke' && '["split"]' || '["colocated","split"]') }}
        law: ${{ fromJSON(inputs.scope == 'smoke' && '["NCD"]' || '["N","NC","ND","NCD"]') }}
        repetition: ${{ fromJSON(inputs.scope == 'smoke' && '[0]' || '[0,1,2,3]') }}

    steps:
      - name: Check out experiment repository
        uses: actions/checkout@v7

      - name: Check out exact benchmark revision
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.application.repository }}
          ref: ${{ matrix.application.commit }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Record runner resources
        run: |
          out="workflow-results/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}"
          mkdir -p "$out"
          uname -a > "$out/runner.txt"
          docker version >> "$out/runner.txt"
          docker compose version >> "$out/runner.txt"
          free -h >> "$out/runner.txt"
          df -h >> "$out/runner.txt"

      - name: Render, lock, and replicate benchmark
        env:
          DEMO_VERSION: "3.0.0"
          LOCUST_AUTOSTART: "false"
          LOCUST_HEADLESS: "true"
          LOCUST_BROWSER_TRAFFIC_ENABLED: "false"
        run: |
          out="workflow-results/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}"
          if [[ "${{ matrix.application.profile }}" == "opentelemetry_demo" ]]; then
            export OTEL_COLLECTOR_CONFIG_EXTRAS="$GITHUB_WORKSPACE/configs/live/otel-pilot-collector-extra.yml"
            docker compose --env-file upstream/.env -f "upstream/${{ matrix.application.compose_file }}" config --format json > "$out/rendered-compose.json"
            telemetry_args=(--telemetry-output-directory "$GITHUB_WORKSPACE/$out")
          else
            docker compose -f "upstream/${{ matrix.application.compose_file }}" config --format json > "$out/rendered-compose.json"
            telemetry_args=()
          fi
          python -m telemetry_availability pin-live-compose \
            --config configs/m7_runtime_pilot.yaml \
            --profile "${{ matrix.application.profile }}" \
            --input "$out/rendered-compose.json" \
            --out "$out/base-pinned-compose.json" \
            --audit "$out/base-image-lock-audit.json" \
            "${telemetry_args[@]}"
          python -m telemetry_availability prepare-placement-compose \
            --config configs/m7b_placement_pilot.yaml \
            --profile "${{ matrix.application.profile }}" \
            --placement "${{ matrix.placement }}" \
            --input "$out/base-pinned-compose.json" \
            --base-audit "$out/base-image-lock-audit.json" \
            --out "$out/pinned-compose.json" \
            --audit "$out/image-lock-audit.json" \
            --haproxy "$out/haproxy.cfg"

      - name: Pull and start replicated benchmark
        run: |
          compose="workflow-results/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}/pinned-compose.json"
          docker compose -f "$compose" pull
          docker compose -f "$compose" up -d --no-build --wait --wait-timeout 360

      - name: Run predeclared stochastic freeze-pilot cell
        run: >-
          python -m telemetry_availability run-stochastic-freeze-pilot
          --config configs/m7c_stochastic_freeze_pilot.yaml
          --profile "${{ matrix.application.profile }}"
          --placement "${{ matrix.placement }}"
          --law "${{ matrix.law }}"
          --repetition "${{ matrix.repetition }}"
          --checkout upstream
          --compose "workflow-results/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}/pinned-compose.json"
          --image-audit "workflow-results/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}/image-lock-audit.json"
          --out "workflow-results/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}"

      - name: Capture compact runtime diagnostics
        if: ${{ always() }}
        run: |
          out="workflow-results/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}"
          docker compose -f "$out/pinned-compose.json" ps --format json > "$out/compose-ps.json" || true
          docker stats --no-stream --format '{{json .}}' > "$out/docker-stats.jsonl" || true

      - name: Capture service logs after a failed cell
        if: ${{ failure() }}
        run: |
          out="workflow-results/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}"
          docker compose -f "$out/pinned-compose.json" logs --no-color > "$out/compose.log" 2>&1 || true

      - name: Upload immutable pilot evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: m7c-cell-${{ matrix.application.profile }}-${{ matrix.placement }}-${{ matrix.law }}-r${{ matrix.repetition }}-${{ github.run_id }}
          path: workflow-results/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}
          if-no-files-found: error
          retention-days: 14

      - name: Tear down benchmark
        if: ${{ always() }}
        run: >-
          docker compose
          -f "workflow-results/${{ matrix.application.profile }}/${{ matrix.placement }}/${{ matrix.law }}/r${{ matrix.repetition }}/pinned-compose.json"
          down --volumes --remove-orphans || true

  aggregate:
    name: Aggregate M7C pilot and freeze M7 budget
    if: ${{ always() && inputs.scope == 'full' }}
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out experiment repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Download all stochastic pilot cells
        uses: actions/download-artifact@v8
        with:
          pattern: m7c-cell-*-${{ github.run_id }}
          path: workflow-results/m7c-input

      - name: Aggregate complete matrix and apply frozen selection rule
        run: >-
          python -m telemetry_availability aggregate-stochastic-freeze-pilots
          --config configs/m7c_stochastic_freeze_pilot.yaml
          --input-root workflow-results/m7c-input
          --out workflow-results/m7c-aggregate

      - name: Upload aggregate and machine-readable recommendation
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: m7c-aggregate-${{ github.run_id }}
          path: workflow-results/m7c-aggregate
          if-no-files-found: error
          retention-days: 14
