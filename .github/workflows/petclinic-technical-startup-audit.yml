name: Petclinic retained technical startup audit
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        required: true
        default: '10046679072'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - name: Verify retained archive and export bounded diagnostic report
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT: ${{ inputs.artifact_id }}
        run: python scripts/audit_petclinic_technical_startup.py --artifact-id "$SOURCE_ARTIFACT"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: petclinic-startup-audit-${{ inputs.artifact_id }}-${{ github.run_id }}
          path: workflow-results/startup-audit
          retention-days: 90
          if-no-files-found: error
