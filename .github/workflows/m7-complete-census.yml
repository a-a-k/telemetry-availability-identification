name: Complete preserved M7 census
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - name: Install pinned environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Census immutable M7 tables without fitting or acquisition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p workflow-results
          /usr/bin/time -v -o workflow-results/m7-census-resources.txt python -m telemetry_availability.m7_complete_census
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: m7-complete-census-${{ github.run_id }}
          path: |
            workflow-results/m7-census
            workflow-results/m7-census-resources.txt
          if-no-files-found: error
          retention-days: 90
