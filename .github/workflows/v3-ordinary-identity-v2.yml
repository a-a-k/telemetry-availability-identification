name: V3 ordinary native identity and joint demand census v2
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [deathstarbench_social_network, opentelemetry_demo, spring_petclinic_microservices]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p workflow-results/preparation
          /usr/bin/time -v -o workflow-results/preparation/resource-usage.txt python -m telemetry_availability.v3_ordinary_identity_v2 prepare --profile '${{ matrix.profile }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-ordinary-identity-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/ordinary
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-identity-preparation-compact-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/preparation
          retention-days: 90
          if-no-files-found: error
  inspect:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [deathstarbench_social_network, opentelemetry_demo, spring_petclinic_microservices]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v8
        with:
          name: v3-ordinary-identity-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-input/ordinary
      - run: |
          mkdir -p workflow-results/inspection
          /usr/bin/time -v -o workflow-results/inspection/resource-usage.txt python -m telemetry_availability.v3_ordinary_identity_v2 inspect --profile '${{ matrix.profile }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-identity-demand-compact-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/inspection
          retention-days: 90
          if-no-files-found: error
