name: V3 exact model size and mask scaling v1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - name: Verify frozen scientific sources
        run: python scripts/verify_staged_research_lock.py configs/v3_comparison_execution_v3.json
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Measure fixed model-size and mask grid with exact controls
        run: python scripts/benchmark_v3_model_scaling_v1.py --out workflow-results/model-scaling
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: v3-model-scaling-compact-${{ github.run_id }}
          path: workflow-results/model-scaling/compact.json
          retention-days: 90
          if-no-files-found: error
