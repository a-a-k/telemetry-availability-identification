name: M5 Directed Stress Tests

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Diagnostic uses 10 campaigns and 19 bootstrap draws; full uses the frozen design.
        required: true
        default: diagnostic
        type: choice
        options:
          - diagnostic
          - full

permissions:
  contents: read

concurrency:
  group: m5-stress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    name: ${{ matrix.series }} (${{ inputs.tier }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        series:
          - exporter_loss
          - temporal_bursts
          - wrong_domain_map
          - rare_branch
          - readiness_lag

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Run diagnostic stress shard
        if: ${{ inputs.tier == 'diagnostic' }}
        run: >-
          python -m telemetry_availability run-stress-experiment
          --config configs/m5_stress.yaml
          --out "workflow-results/${{ matrix.series }}"
          --series "${{ matrix.series }}"
          --repetitions 10
          --sample-sizes 500,2000
          --bootstrap-replicates 19

      - name: Run full stress shard
        if: ${{ inputs.tier == 'full' }}
        run: >-
          python -m telemetry_availability run-stress-experiment
          --config configs/m5_stress.yaml
          --out "workflow-results/${{ matrix.series }}"
          --series "${{ matrix.series }}"

      - name: Upload immutable stress shard
        uses: actions/upload-artifact@v7
        with:
          name: m5-${{ matrix.series }}-${{ github.run_id }}
          path: workflow-results/${{ matrix.series }}
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate M5 tables
    needs: experiment
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Download stress shards
        uses: actions/download-artifact@v8
        with:
          pattern: m5-*-${{ github.run_id }}
          path: workflow-shards

      - name: Aggregate stress tables
        run: >-
          python -m telemetry_availability aggregate-stress-experiment
          --input-root workflow-shards
          --out workflow-results/aggregate

      - name: Require internally valid stress evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("workflow-results/aggregate/manifest.json").read_text())
          failures = {name: value for name, value in manifest["quality"].items() if value}
          if failures:
              raise SystemExit(f"M5 quality-gate failures: {failures}")
          PY

      - name: Upload aggregate
        uses: actions/upload-artifact@v7
        with:
          name: m5-aggregate-${{ github.run_id }}
          path: workflow-results/aggregate
          if-no-files-found: error
          retention-days: 30
