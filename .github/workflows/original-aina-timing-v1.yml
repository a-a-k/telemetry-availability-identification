name: Original AINA timing feasibility audit v1
on:
  workflow_dispatch:
permissions: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p workflow-results/aina-timing-compact
          /usr/bin/time -v -o workflow-results/aina-timing-compact/resource-usage.txt python scripts/audit_original_aina_timing_v1.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-aina-timing-compact-${{ github.run_id }}
          path: workflow-results/aina-timing-compact
          retention-days: 90
          if-no-files-found: error
