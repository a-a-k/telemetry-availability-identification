name: M9S retained PMX integer-loop PMF bridge
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: 3.13.15
    - name: Install and validate the frozen control
      run: |
        python -m pip install -r requirements.txt
        python -m pip install --no-deps -e .
        python -m telemetry_availability.pmx_pmf_bridge validate
    - name: Verify two retained archives and create the twelve-model contract
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -m telemetry_availability.pmx_pmf_bridge prepare --inputs
        workflow-input/m9s --out workflow-results/m9s-contract
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: m9s-pmx-pmf-bridge-contract-${{ github.run_id }}
        path: workflow-results/m9s-contract
        if-no-files-found: error
        retention-days: 90
  palladio_solver:
    name: Load every retained PMX variant and attempt the pinned reliability solver
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Check out study repository
      uses: actions/checkout@v7
    - name: Check out pinned Palladio reliability source
      uses: actions/checkout@v7
      with:
        repository: PalladioSimulator/Palladio-Analyzer-Reliability
        ref: a694e570afb705dc9e0470dc321e77b7219dcea4
        path: palladio-source
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.13.15
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Set up pinned Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Install dependencies and validate the frozen contract
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install --no-deps -e .
        python -m telemetry_availability.pmx_pmf_bridge validate
        test "$(git -C palladio-source rev-parse HEAD)" = \
          "a694e570afb705dc9e0470dc321e77b7219dcea4"
    - name: Download the retained artificial PCM contract
      uses: actions/download-artifact@v8
      with:
        name: m9s-pmx-pmf-bridge-contract-${{ github.run_id }}
        path: workflow-input/m9s-contract
    - name: Reconstruct and audit the accepted release-date target platform
      run: |
        m9s_maven_repo="${RUNNER_TEMP}/m9s-maven-repository"
        evidence_dir="workflow-results/m9s-solver/target-lock/repository"
        mkdir -p "$m9s_maven_repo" "$evidence_dir"
        coordinate="$(jq -r '.target_platform_lock.coordinate' configs/m9a_palladio_bootstrap.json)"
        mvn -B -ntp "-Dmaven.repo.local=${m9s_maven_repo}" \
          dependency:get "-Dartifact=${coordinate}"
        target_file="${m9s_maven_repo}/org/palladiosimulator/palladio-target-platforms/0.1.0/palladio-target-platforms-0.1.0-palladio-2023-03.target"
        repository_url="$(jq -r '.target_platform_lock.pinned_repository_url' configs/m9a_palladio_bootstrap.json)"
        while IFS= read -r relative_path; do
          mkdir -p "${evidence_dir}/$(dirname "$relative_path")"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "${evidence_dir}/${relative_path}" \
            "${repository_url}${relative_path}"
        done < <(jq -r '.target_platform_lock.repository_evidence[].relative_path' configs/m9a_palladio_bootstrap.json)
        python -m telemetry_availability lock-palladio-target-platform \
          --config configs/m9a_palladio_bootstrap.json \
          --target-file "$target_file" \
          --repository-evidence-dir "$evidence_dir" \
          --out workflow-results/m9s-solver/target-lock/manifest.json
        echo "M9S_MAVEN_REPO=${m9s_maven_repo}" >> "$GITHUB_ENV"
        git -C palladio-source diff --exit-code
    - name: Reconfirm the accepted analyzer capability boundary
      run: python -m telemetry_availability audit-palladio-capability-source --config
        configs/m9b_palladio_semantic_controls.json --analyzer-checkout palladio-source
        --out workflow-results/m9s-solver/capability-manifest.json
    - name: Overlay only the audited generic M9S harness
      run: |
        test_bundle="palladio-source/tests/org.palladiosimulator.reliability.tests"
        cp palladio/harness/META-INF/MANIFEST.MF "$test_bundle/META-INF/MANIFEST.MF"
        cp palladio/harness/src/org/palladiosimulator/reliability/tests/PmxPmfBridgeTest.java \
          "$test_bundle/src/org/palladiosimulator/reliability/tests/PmxPmfBridgeTest.java"
        git -C palladio-source status --short > workflow-results/m9s-solver/harness-overlay.txt
        test "$(git -C palladio-source diff --name-only)" = \
          "tests/org.palladiosimulator.reliability.tests/META-INF/MANIFEST.MF"
        test "$(git -C palladio-source ls-files --others --exclude-standard)" = \
          "tests/org.palladiosimulator.reliability.tests/src/org/palladiosimulator/reliability/tests/PmxPmfBridgeTest.java"
    - name: Build the pinned analyzer without running the aligned experiment
      run: |
        mkdir -p workflow-results/m9s-solver/runtime
        java -version > workflow-results/m9s-solver/runtime/java-version.txt 2>&1
        mvn -version > workflow-results/m9s-solver/runtime/maven-version.txt 2>&1
        lscpu > workflow-results/m9s-solver/runtime/runner-cpu.txt
        free -b > workflow-results/m9s-solver/runtime/runner-memory.txt
        set -o pipefail
        /usr/bin/time -v -o workflow-results/m9s-solver/runtime/build-resource-usage.txt \
          xvfb-run -a mvn -B -ntp "-Dmaven.repo.local=${M9S_MAVEN_REPO}" \
            -DskipTests=true -f palladio-source/pom.xml clean verify \
          2>&1 | tee workflow-results/m9s-solver/runtime/build.log
        test "${PIPESTATUS[0]}" -eq 0
    - name: Attempt twelve frozen models in two passes and retain each exception
      env:
        TAID_PALLADIO_ALIGNED_ROOT: ${{ github.workspace }}/workflow-input/m9s-contract/models
        TAID_PALLADIO_RESULT: ${{ github.workspace }}/workflow-results/m9s-solver/raw-result.json
        TAID_REPEAT_RUNS: '2'
        TAID_EXPECTED_MODEL_COUNT: '12'
        TAID_EXPECTED_CASE_COUNT: '12'
        TAID_PROBABILITY_TOLERANCE: "1e-12"
      run: |
        set -o pipefail
        /usr/bin/time -v -o workflow-results/m9s-solver/runtime/solve-resource-usage.txt \
          xvfb-run -a mvn -B -ntp "-Dmaven.repo.local=${M9S_MAVEN_REPO}" \
            -f palladio-source/pom.xml verify \
          2>&1 | tee workflow-results/m9s-solver/runtime/solve.log
        test "${PIPESTATUS[0]}" -eq 0
    - name: Collect test reports
      if: ${{ always() }}
      run: |
        report_root="palladio-source/tests/org.palladiosimulator.reliability.tests/target/surefire-reports"
        if [[ -d "$report_root" ]]; then
          cp -R "$report_root" workflow-results/m9s-solver/surefire-reports
        fi
    - name: Retain raw untuned solver output and timing
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: m9s-pmx-pmf-bridge-solver-${{ github.run_id }}
        path: workflow-results/m9s-solver
        if-no-files-found: error
        retention-days: 90
  census:
    needs:
    - prepare
    - palladio_solver
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: 3.13.15
    - name: Install and validate the frozen control
      run: |
        python -m pip install -r requirements.txt
        python -m pip install --no-deps -e .
        python -m telemetry_availability.pmx_pmf_bridge validate
    - uses: actions/download-artifact@v8
      with:
        name: m9s-pmx-pmf-bridge-contract-${{ github.run_id }}
        path: workflow-input/m9s-contract
    - uses: actions/download-artifact@v8
      with:
        name: m9s-pmx-pmf-bridge-solver-${{ github.run_id }}
        path: workflow-input/m9s-solver
    - name: Retain all missing error and numeric outcomes under the fixed oracles
      run: python -m telemetry_availability.pmx_pmf_bridge summarize --contract-root
        workflow-input/m9s-contract --solver-root workflow-input/m9s-solver --out
        workflow-results/m9s-census
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: m9s-pmx-pmf-bridge-census-${{ github.run_id }}
        path: workflow-results/m9s-census
        if-no-files-found: error
        retention-days: 90
