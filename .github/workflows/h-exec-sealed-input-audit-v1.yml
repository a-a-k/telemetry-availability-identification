name: H-EXEC immutable final input audit and statistical replay v1
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p workflow-results/h-exec-sealed-compact
          /usr/bin/time -v -o workflow-results/h-exec-sealed-compact/resource-usage.txt python scripts/audit_h_exec_sealed_inputs_v1.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: h-exec-sealed-audit-compact-${{ github.run_id }}
          path: workflow-results/h-exec-sealed-compact
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: h-exec-sealed-recomputed-compact-${{ github.run_id }}
          path: workflow-results/recomputed-cells
          retention-days: 90
          if-no-files-found: error
