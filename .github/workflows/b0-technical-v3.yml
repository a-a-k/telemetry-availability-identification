name: B0-v3 three-application technical binding
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [deathstarbench_social_network, opentelemetry_demo, spring_petclinic_microservices]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.15
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p workflow-results/compact
          /usr/bin/time -v -o workflow-results/compact/preparation-resource-usage.txt python scripts/b0_technical_v3.py prepare --profile '${{ matrix.profile }}'
      - run: /usr/bin/time -v -o workflow-results/compact/fit-resource-usage.txt python -m telemetry_availability.b0_frequency_v3 --input workflow-input/b0 --output workflow-results/model --operations ${{ steps.prepare.outputs.operations }}
      - run: python scripts/b0_technical_v3.py report --profile '${{ matrix.profile }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: b0-v3-model-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/model
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: b0-v3-compact-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/compact
          retention-days: 90
          if-no-files-found: error
