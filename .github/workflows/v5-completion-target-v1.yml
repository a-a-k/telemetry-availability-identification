name: V5 completion target identification and costs v1
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [deathstarbench_social_network, opentelemetry_demo, spring_petclinic_microservices]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install the fixed Python environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Verify unchanged scientific locks and bounded algebra controls
        run: |
          python scripts/verify_staged_research_lock.py configs/v3_comparison_execution_v3.json
          python -m unittest discover -s tests -p test_completion_target_v1.py -v
      - name: Measure three equal-target routes then audit all preserved observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/run_completion_target_v1.py --profile '${{ matrix.profile }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v5-completion-compact-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/completion-target/compact/*.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v5-completion-full-${{ matrix.profile }}-${{ github.run_id }}
          path: workflow-results/completion-target/full
          if-no-files-found: error
          retention-days: 90
  tables:
    needs: experiment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: v5-completion-compact-*-${{ github.run_id }}
          path: workflow-input/completion-compact
      - name: Export every observation setting and paired measurement
        run: python scripts/summarize_completion_target_v1.py --source workflow-input/completion-compact --out workflow-results/completion-tables
      - uses: actions/upload-artifact@v7
        with:
          name: v5-completion-tables-${{ github.run_id }}
          path: workflow-results/completion-tables
          if-no-files-found: error
          retention-days: 90
