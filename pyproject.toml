[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-availability-identification"
version = "0.1.0"
description = "Experiments for telemetry-driven identification of stochastic microservice availability models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.17,<2",
]

[project.scripts]
taid = "telemetry_availability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
