schema_version: 1
id: m7c_stochastic_schedule_and_budget_freeze_pilot
pilot_only: true
placement_config: m7b_placement_pilot.yaml

pilot_repetitions: 4
baseline_seconds: 60
period_seconds: 300
request_rate_per_second: 4
request_timeout_seconds: 2
request_workers: 16
inter_period_recovery_seconds: 10
health_poll_seconds: 1
transition_observation_minimum_ticks: 2
trace_flush_seconds: 20

minimum_baseline_semantic_success_fraction: 0.98
minimum_linked_success_fraction: 0.80
minimum_health_observation_fraction: 0.85
minimum_backend_sessions_per_replica: 1

pilot_base_seed: 770033
main_base_seed: 770034

failure_laws:
  N: [individual]
  NC: [individual, communication]
  ND: [individual, common_domain]
  NCD: [individual, communication, common_domain]

# Each primitive factor is an independent alternating renewal process. The up
# interval is minimum_up + Exponential(mean_up - minimum_up); the down interval
# is Uniform(minimum_down, maximum_down). A new up interval begins only after
# the previous down interval of that same factor ends.
renewal_processes:
  individual:
    minimum_up_seconds: 12
    mean_up_seconds: 35
    minimum_down_seconds: 5
    maximum_down_seconds: 9
  communication:
    minimum_up_seconds: 20
    mean_up_seconds: 55
    minimum_down_seconds: 4
    maximum_down_seconds: 8
  common_domain:
    minimum_up_seconds: 30
    mean_up_seconds: 75
    minimum_down_seconds: 6
    maximum_down_seconds: 10

design_selection:
  candidate_period_seconds: [900, 1200, 1800]
  minimum_events_per_factor_period: 8
  minimum_schedule_fraction: 0.90
  minimum_effective_blocks_per_period: 30
  acf_absolute_threshold: 0.10
  acf_consecutive_lags: 3
  acf_max_lag_seconds: 120
  transition_guard_candidates_seconds: [1, 2, 3, 5, 8]
  transition_lag_quantile: 0.95
  candidate_main_repetitions: [10, 15, 20, 30, 40]
  target_paired_half_width: 0.015
  paired_confidence_level: 0.95
  sd_upper_confidence_level: 0.90
  planning_sd_floor: 0.015
